<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spidy · Commercial Vehicle Marketplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#E5194D; --primary-600:#C8103F; --primary-50:#FFF1F4; --primary-100:#FFE0E7;
  --ink:#101B3B; --ink-2:#4A5372; --ink-3:#7C849E;
  --green:#138A43; --green-50:#ECF8F0;
  --amber:#F5A524; --amber-50:#FFF7E6;
  --blue:#2563EB; --blue-50:#EEF4FF;
  --violet:#7C3AED; --violet-50:#F3EEFF;
  --bg:#F5F6FA; --surface:#FFFFFF; --surface-2:#FAFBFD; --line:#E7E9F0; --line-2:#F0F2F7;
  --chat-me:#E6F9DF; --chat-bg:#F7F8FB;
  --shadow-sm:0 1px 2px rgba(16,27,59,.06);
  --shadow:0 2px 10px rgba(16,27,59,.06), 0 1px 2px rgba(16,27,59,.04);
  --shadow-lg:0 20px 50px rgba(16,27,59,.18);
  --r-sm:10px; --r:14px; --r-lg:20px;
  --font:'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --nav-h:68px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#EEF0F7; --ink-2:#B4BAD0; --ink-3:#8790AC;
    --bg:#0E1222; --surface:#161B2E; --surface-2:#1B2136; --line:#262D46; --line-2:#20263C;
    --primary-50:#2A1622; --primary-100:#3A1A2A; --green-50:#132A20; --amber-50:#2C2414; --blue-50:#152040; --violet-50:#211A3A;
    --chat-me:#1D3A2A; --chat-bg:#12172A; --green:#34C46F;
    --shadow:0 2px 10px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#EEF0F7; --ink-2:#B4BAD0; --ink-3:#8790AC;
  --bg:#0E1222; --surface:#161B2E; --surface-2:#1B2136; --line:#262D46; --line-2:#20263C;
  --primary-50:#2A1622; --primary-100:#3A1A2A; --green-50:#132A20; --amber-50:#2C2414; --blue-50:#152040; --violet-50:#211A3A;
  --chat-me:#1D3A2A; --chat-bg:#12172A; --green:#34C46F;
  --shadow:0 2px 10px rgba(0,0,0,.35); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
img,svg{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{font:inherit;color:var(--ink)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2.5px solid var(--primary);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.ic{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:18px;height:18px}.ic.xs{width:15px;height:15px}.ic.lg{width:28px;height:28px}

/* ---------- Shell ---------- */
#app{min-height:100vh;padding-bottom:calc(var(--nav-h) + 16px)}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:12px;height:64px}
.topbar h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.topbar .sub{font-size:13px;color:var(--ink-2);font-weight:500}
.topbar .grow{flex:1;min-width:0}
.icon-btn{position:relative;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--ink);transition:background .15s}
.icon-btn:hover{background:var(--line-2)}
.icon-btn.fav-on{color:var(--primary)}
.badge{position:absolute;top:4px;right:3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--primary);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--surface)}
.dot{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--primary);border:2px solid var(--surface)}
.brand-mark{display:flex;align-items:center;gap:9px;font-weight:800;font-size:20px;letter-spacing:-.02em}
.brand-mark .logo{width:34px;height:34px;border-radius:10px;background:var(--primary);display:grid;place-items:center;color:#fff}
.desk-nav{display:none;gap:4px;margin-left:14px}
.desk-nav a{padding:9px 14px;border-radius:10px;font-weight:600;font-size:14px;color:var(--ink-2)}
.desk-nav a.on,.desk-nav a:hover{color:var(--primary);background:var(--primary-50)}

.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -6px 20px rgba(16,27,59,.05)}
.bottom-nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h);align-items:center}
.bn{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--ink-2);position:relative}
.bn.on{color:var(--primary)}
.bn .dot{top:-2px;right:calc(50% - 16px)}
.bn-sell{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--ink-2)}
.bn-sell span.plus{width:56px;height:56px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;margin-top:-30px;box-shadow:0 8px 20px rgba(229,25,77,.38);border:4px solid var(--surface);transition:transform .15s}
.bn-sell:hover span.plus{transform:scale(1.05)}
@media (min-width:960px){
  .desk-nav{display:flex}
  .bottom-nav{display:none}
  #app{padding-bottom:40px}
}

/* ---------- Generic ---------- */
.page{padding-top:18px;animation:pg .25s ease}
@keyframes pg{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.h-xl{font-size:clamp(26px,4.4vw,36px);font-weight:800;letter-spacing:-.025em;line-height:1.1;margin:6px 0 6px}
.lead{color:var(--ink-2);margin:0 0 20px;font-size:15.5px}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:28px 0 12px}
.sec-head h2{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em}
.link{color:var(--primary);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:50px;padding:0 22px;border-radius:12px;font-weight:700;font-size:15px;transition:transform .08s, background .15s, box-shadow .15s;white-space:nowrap}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 6px 16px rgba(229,25,77,.25)}
.btn-primary:hover{background:var(--primary-600)}
.btn-outline{border:1.5px solid var(--primary);color:var(--primary);background:var(--surface)}
.btn-outline:hover{background:var(--primary-50)}
.btn-ghost{background:var(--line-2);color:var(--ink)}
.btn-ghost:hover{background:var(--line)}
.btn-block{width:100%}
.btn-sm{height:38px;padding:0 14px;font-size:13.5px;border-radius:10px}
.btn[disabled]{opacity:.55;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;transition:all .15s}
.chip:hover{border-color:var(--ink-3)}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 18px;scrollbar-width:none;margin:0 -18px}
.chips::-webkit-scrollbar{display:none}
.price{color:var(--green);font-weight:800;letter-spacing:-.01em}
.muted{color:var(--ink-3)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;color:var(--ink-2);font-size:13.5px;font-weight:500}
.meta i{width:4px;height:4px;border-radius:50%;background:var(--primary);display:inline-block}
.verified{color:var(--primary);display:inline-flex}
.empty{text-align:center;padding:48px 20px;color:var(--ink-2)}
.empty .em-ic{width:76px;height:76px;border-radius:50%;background:var(--primary-50);color:var(--primary);display:grid;place-items:center;margin:0 auto 14px}
.empty h3{margin:0 0 6px;color:var(--ink);font-size:18px}
.empty p{margin:0 0 18px}
.skel{background:linear-gradient(90deg,var(--line-2),var(--line),var(--line-2));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:10px}
@keyframes sk{to{background-position:-200% 0}}

/* ---------- Home ---------- */
.home-top{display:flex;align-items:center;gap:10px;padding:14px 0 6px}
.searchbar{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:50px;padding:0 6px 0 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.searchbar input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:14.5px}
.searchbar .sep{width:1px;height:26px;background:var(--line)}
.home-icons{display:flex}
.hero{position:relative;border-radius:var(--r-lg);overflow:hidden;margin-top:14px;aspect-ratio:16/8.4;min-height:230px;max-height:430px;width:100%;background:#cfe4f5;box-shadow:var(--shadow)}
.hero-slide{position:absolute;inset:0;opacity:0;transition:opacity .7s ease}
.hero-slide.on{opacity:1}
.hero-slide svg.scene{position:absolute;inset:0;width:100%;height:100%}
.hero-copy{position:absolute;left:0;top:0;bottom:0;width:min(560px,62%);padding:clamp(18px,4vw,40px);display:flex;flex-direction:column;justify-content:center;color:#101B3B;background:linear-gradient(90deg,rgba(255,255,255,.88),rgba(255,255,255,.55) 70%,transparent)}
.hero-copy h2{font-size:clamp(20px,3.6vw,38px);line-height:1.08;margin:0 0 10px;font-weight:800;letter-spacing:-.025em}
.hero-copy p{margin:0 0 16px;font-size:clamp(13px,1.6vw,16px);color:#33405f;max-width:34ch}
.hero-copy .btn{align-self:flex-start;height:42px;font-size:14px}
.hero-dots{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
.hero-dots button{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.85);transition:all .25s}
.hero-dots button.on{background:var(--primary);width:26px;border-radius:6px}
.cats{display:grid;grid-template-columns:repeat(7,minmax(104px,1fr));gap:10px;overflow-x:auto;padding:18px 18px 4px;margin:0 -18px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 8px 12px;text-align:center;font-weight:600;font-size:13.5px;line-height:1.25;transition:border-color .15s, transform .15s;display:flex;flex-direction:column;align-items:center;gap:8px}
.cat:hover{border-color:var(--primary);transform:translateY(-2px)}
.cat .art{width:100%;height:64px}
.bs-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.bs{display:flex;align-items:center;gap:16px;padding:20px;border-radius:var(--r-lg);border:1px solid}
.bs.buy{background:var(--primary-50);border-color:var(--primary-100)}
.bs.sell{background:var(--green-50);border-color:color-mix(in srgb,var(--green) 22%,transparent)}
.bs .circ{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.bs.buy .circ{background:var(--primary)} .bs.sell .circ{background:var(--green)}
.bs h3{margin:0 0 2px;font-size:22px;font-weight:800}
.bs.buy h3,.bs.buy .arr{color:var(--primary)} .bs.sell h3,.bs.sell .arr{color:var(--green)}
.bs p{margin:0;color:var(--ink-2);font-size:14px;line-height:1.4}
.bs .arr{margin-left:auto}
.recent{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,1fr);gap:12px;overflow-x:auto;padding:2px 18px 6px;margin:0 -18px;scrollbar-width:none}
.recent::-webkit-scrollbar{display:none}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:relative;transition:box-shadow .15s}
.mini:hover{box-shadow:var(--shadow)}
.mini .thumb{aspect-ratio:16/10;overflow:hidden;background:var(--line-2)}
.mini .thumb>*{width:100%;height:100%;object-fit:cover}
.mini .body{padding:10px 12px 12px}
.mini h4{margin:0 0 3px;font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .meta{font-size:12.5px}
.mini .price{font-size:17px;margin-top:6px}
.tag-new{position:absolute;top:10px;left:10px;background:var(--primary);color:#fff;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:6px;z-index:2}
.heart{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:#4A5372;z-index:2;transition:transform .15s}
.heart:hover{transform:scale(1.08)}
.heart.on{color:var(--primary)}
.heart.on .ic{fill:var(--primary)}
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:22px 0 10px;padding:14px 6px}
.trust>div{display:flex;align-items:center;gap:10px;padding:4px 14px;font-size:13px;font-weight:600;line-height:1.3}
.trust>div+div{border-left:1px solid var(--line)}
.trust .t-ic{color:var(--primary)}
@media (max-width:720px){
  .bs-row{grid-template-columns:1fr}
  .trust{grid-template-columns:1fr 1fr;row-gap:12px}
  .trust>div:nth-child(3){border-left:0}
  .hero-copy{width:78%}
}

/* ---------- Type lists ---------- */
.type-row{display:flex;align-items:stretch;overflow:hidden;margin-bottom:12px;transition:border-color .15s, box-shadow .15s}
.type-row:hover{border-color:color-mix(in srgb,var(--primary) 40%,var(--line));box-shadow:var(--shadow)}
.type-row .pic{width:min(34%,280px);flex:none;display:grid;place-items:center;padding:10px}
.type-row .pic svg{width:100%;height:auto;max-height:118px}
.type-row .info{flex:1;display:flex;align-items:center;gap:16px;padding:16px 18px;min-width:0}
.type-row .tic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;flex:none}
.type-row h3{margin:0;font-size:clamp(16px,2.4vw,21px);font-weight:700;letter-spacing:-.01em}
.type-row p{margin:3px 0 0;color:var(--ink-2);font-size:14px;line-height:1.4}
.type-row .go{margin-left:auto;width:44px;height:44px;border-radius:50%;background:var(--primary-50);color:var(--primary);display:grid;place-items:center;flex:none}
.tint-red{background:var(--primary-50);color:var(--primary)} .tint-amber{background:var(--amber-50);color:#D98300}
.tint-blue{background:var(--blue-50);color:var(--blue)} .tint-green{background:var(--green-50);color:var(--green)} .tint-violet{background:var(--violet-50);color:var(--violet)}
.bg-tint-red{background:linear-gradient(135deg,#FFF4F6,#fff)} .bg-tint-amber{background:linear-gradient(135deg,#FFF8EA,#fff)}
.bg-tint-blue{background:linear-gradient(135deg,#EFF5FF,#fff)} .bg-tint-green{background:linear-gradient(135deg,#EEF9F2,#fff)} .bg-tint-violet{background:linear-gradient(135deg,#F5F0FF,#fff)} .bg-tint-orange{background:linear-gradient(135deg,#FFF3EA,#fff)}
:root[data-theme="dark"] [class*="bg-tint-"]{background:var(--surface-2)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) [class*="bg-tint-"]{background:var(--surface-2)}}
@media (max-width:560px){.type-row .tic{display:none}.type-row .pic{width:40%}.type-row .info{padding:12px}}
.notice{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--r);background:var(--primary-50);border:1px solid var(--primary-100);margin-bottom:16px;font-size:14px;color:var(--ink-2)}
.notice .n-ic{width:50px;height:50px;border-radius:12px;background:var(--surface);color:var(--primary);display:grid;place-items:center;flex:none;border:1px solid var(--primary-100)}
.brand-logo{width:84px;height:84px;border-radius:14px;border:1px solid var(--line);display:grid;place-items:center;flex:none;background:var(--surface);font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand-logo span{font-size:10px;font-weight:700;letter-spacing:.02em;display:block;margin-top:2px;opacity:.85}
.brand-row .info{gap:14px}
.brand-row .series{color:var(--ink-2);font-size:13.5px;margin-top:4px;display:flex;flex-wrap:wrap;gap:2px 8px}
.brand-row .series i{width:4px;height:4px;border-radius:50%;background:var(--primary);align-self:center}

/* ---------- Listing ---------- */
.list-tools{display:flex;align-items:center;gap:12px;padding:12px 0 0}
.list-tools .count{color:var(--ink-2);font-weight:600;font-size:13.5px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:520px){.list-tools{flex-wrap:wrap}.list-tools .count{order:3;flex-basis:100%}}
.sel{position:relative}
.sel select{appearance:none;height:40px;padding:0 34px 0 38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13.5px;cursor:pointer}
.sel .ic{position:absolute;top:50%;transform:translateY(-50%);pointer-events:none}
.sel .ic.l{left:11px}.sel .ic.r{right:10px}
.lgrid{display:grid;grid-template-columns:1fr;gap:12px;padding-top:4px}
@media (min-width:860px){.lgrid{grid-template-columns:1fr 1fr}}
.lcard{display:flex;gap:16px;padding:10px;position:relative;transition:box-shadow .15s,border-color .15s}
.lcard:hover{box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--ink-3) 40%,var(--line))}
.lcard .thumb{width:44%;max-width:260px;aspect-ratio:4/3;border-radius:10px;overflow:hidden;flex:none;position:relative;background:var(--line-2)}
.lcard .thumb>svg,.lcard .thumb>img{width:100%;height:100%;object-fit:cover}
.brand-pill{position:absolute;top:9px;left:9px;font-size:10.5px;font-weight:800;color:#fff;padding:3px 9px;border-radius:999px;z-index:2;letter-spacing:.02em}
.lcard .body{flex:1;min-width:0;display:flex;flex-direction:column;padding:6px 4px 4px 0}
.lcard h3{margin:0 34px 6px 0;font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.lcard .loc{display:flex;align-items:center;gap:6px;color:var(--ink-2);font-size:13.5px;margin-top:8px}
.lcard .foot{margin-top:auto;text-align:right}
.lcard .price{font-size:20px}
.lcard .ago{font-size:12.5px;color:var(--ink-3)}
.lcard .heart{top:12px;right:10px;background:transparent}
.lcard .sold{position:absolute;inset:0;background:rgba(16,27,59,.55);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;z-index:3;letter-spacing:.06em}
@media (max-width:460px){.lcard{gap:12px}.lcard h3{font-size:15.5px}.lcard .price{font-size:17px}.lcard .meta{font-size:12.5px}}
.fab-sell{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom,0px));z-index:35;height:46px;padding:0 22px;border-radius:999px;background:var(--primary);color:#fff;font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:0 10px 24px rgba(229,25,77,.35);white-space:nowrap}
@media (min-width:960px){.fab-sell{bottom:28px}}

/* ---------- Sheets / modals ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,15,35,.5);z-index:80;display:flex;align-items:flex-end;justify-content:center;animation:fd .2s}
@keyframes fd{from{opacity:0}}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 20px calc(20px + env(safe-area-inset-bottom,0px));animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (min-width:640px){.overlay{align-items:center}.sheet{border-radius:22px}}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet h3{margin:0 0 14px;font-size:19px}
.sheet-foot{display:flex;gap:10px;margin-top:20px;position:sticky;bottom:0;background:var(--surface);padding-top:10px}
.opt-group{margin-bottom:18px}
.opt-group>label{display:block;font-weight:700;font-size:14px;margin-bottom:8px}
.opt-group .chips{padding:0;margin:0;flex-wrap:wrap}

/* ---------- Forms ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.field label .req{color:var(--primary)}
.input{width:100%;height:50px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-size:15px;outline:0;transition:border-color .15s, box-shadow .15s}
textarea.input{height:auto;padding:12px 14px;resize:vertical;min-height:110px}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-50)}
.input.err{border-color:var(--primary);background:var(--primary-50)}
.err-msg{color:var(--primary);font-size:12.5px;margin-top:5px;font-weight:600}
.ifield{display:flex;gap:12px;align-items:stretch;margin-bottom:12px}
.ifield .ibox{width:54px;border-radius:12px;background:var(--primary-50);color:var(--primary);display:grid;place-items:center;flex:none}
.ifield .ctl{flex:1;border:1px solid var(--line);border-radius:12px;padding:8px 14px;background:var(--surface);transition:border-color .15s, box-shadow .15s;position:relative}
.ifield .ctl:focus-within{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-50)}
.ifield .ctl.err{border-color:var(--primary)}
.ifield .ctl label{font-size:13px;font-weight:600;display:block}
.ifield .ctl input,.ifield .ctl select{border:0;outline:0;width:100%;background:transparent;font-size:15px;padding:2px 0;appearance:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.pw-wrap{position:relative}
.pw-wrap button{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--ink-3)}

/* ---------- Auth ---------- */
.auth{min-height:calc(100vh - 40px);display:grid;grid-template-columns:1.05fr 1fr;max-width:1180px;margin:0 auto;padding:20px 18px;gap:28px;align-items:center}
.auth-art{border-radius:24px;overflow:hidden;position:relative;min-height:560px;height:100%;background:#0F1B3D;color:#fff;padding:36px;display:flex;flex-direction:column}
.auth-art svg.scene{position:absolute;left:0;right:0;bottom:0;width:100%;height:58%}
.auth-art h2{font-size:34px;line-height:1.1;margin:30px 0 10px;font-weight:800;letter-spacing:-.025em;max-width:14ch;position:relative}
.auth-art p{color:#C4CBE3;max-width:36ch;margin:0;position:relative}
.auth-card{max-width:440px;width:100%;margin:0 auto}
.auth-card h1{font-size:30px;margin:14px 0 4px;letter-spacing:-.02em}
.tabs{display:flex;background:var(--line-2);border-radius:12px;padding:4px;margin:18px 0}
.tabs button{flex:1;height:40px;border-radius:9px;font-weight:700;color:var(--ink-2)}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.or{display:flex;align-items:center;gap:12px;color:var(--ink-3);font-size:13px;margin:16px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
@media (max-width:880px){.auth{grid-template-columns:1fr}.auth-art{display:none}}

/* ---------- Details ---------- */
.det-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
@media (max-width:860px){.det-grid{grid-template-columns:minmax(0,1fr)}.side-card{position:static}}
.side-ctas{display:none;flex-direction:column;gap:10px;margin-top:16px}
@media (min-width:861px){.side-ctas{display:flex}}
.gallery{position:relative;border-radius:var(--r-lg);overflow:hidden;aspect-ratio:16/11;background:var(--line-2)}
.gallery .g-main>*{width:100%;height:100%;object-fit:cover}
.gallery .g-main{position:absolute;inset:0}
.g-count{position:absolute;top:14px;left:14px;background:rgba(16,27,59,.75);color:#fff;font-size:13px;font-weight:700;padding:4px 10px;border-radius:8px}
.g-nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.95);color:#101B3B;display:grid;place-items:center;box-shadow:var(--shadow)}
.g-nav.l{left:14px}.g-nav.r{right:14px}
.thumbs{display:flex;gap:10px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.thumbs button{width:104px;aspect-ratio:4/3;border-radius:10px;overflow:hidden;flex:none;border:2.5px solid transparent;opacity:.85}
.thumbs button.on{border-color:var(--primary);opacity:1}
.thumbs button>*{width:100%;height:100%;object-fit:cover}
.side-card{padding:20px;position:sticky;top:84px}
.side-card .lbl{color:var(--ink-2);font-weight:600;font-size:14px}
.side-card .price{font-size:32px;line-height:1.15;margin:2px 0}
.seller{display:flex;align-items:center;gap:12px;padding:16px 0;border-top:1px solid var(--line);margin-top:14px}
.avatar{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:800;color:#fff;font-size:17px}
.avatar.ghost{background:var(--primary-50);color:var(--primary)}
.seller b{display:flex;align-items:center;gap:5px;font-size:15px}
.stars{display:flex;align-items:center;gap:4px;font-size:14px;font-weight:600;color:var(--ink-2)}
.stars .ic{color:#F5A524;fill:#F5A524}
.det-title{font-size:clamp(24px,3.4vw,32px);margin:18px 0 4px;font-weight:800;letter-spacing:-.02em}
.specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px;padding:14px 8px;margin:16px 0}
.spec{display:flex;align-items:center;gap:9px;padding:4px 8px;min-width:0}
.spec .ic{color:var(--primary)}
.spec small{display:block;font-size:12px;color:var(--ink-2);font-weight:600}
.spec b{font-size:14px;font-weight:700;white-space:nowrap}
@media (max-width:1000px){.specs{row-gap:14px}}
@media (max-width:480px){.specs{grid-template-columns:repeat(2,1fr)}}
.det-cols{display:grid;grid-template-columns:1fr 1.15fr;gap:16px}
@media (max-width:700px){.det-cols{grid-template-columns:1fr}}
.panel{padding:18px 20px}
.panel h3{margin:0 0 12px;font-size:17px;font-weight:700}
.hl{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:14.5px}
.hl .ic{color:var(--primary)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:14.5px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--ink-2)} .kv b{font-weight:600;text-align:right}
.posted{display:flex;flex-direction:column;gap:4px;color:var(--ink-2);font-size:13.5px;margin:16px 0}
.posted div{display:flex;align-items:center;gap:8px}
.cta-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:8px 0 20px}
.cta-row .note{grid-column:2;text-align:center;font-size:13px;color:var(--ink-2);margin-top:-6px}
@media (max-width:520px){.cta-row{grid-template-columns:1fr}.cta-row .note{grid-column:1}}

/* ---------- Chat ---------- */
.chat-page{display:flex;flex-direction:column;height:calc(100vh - var(--nav-h) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
@media (min-width:960px){.chat-page{height:calc(100vh - 64px - 24px)}}
.chat-head{padding:12px 0 0}
.vcard{display:flex;gap:14px;padding:12px;align-items:center}
.vcard .thumb{width:150px;aspect-ratio:4/3;border-radius:10px;overflow:hidden;flex:none}
.vcard .thumb>*{width:100%;height:100%;object-fit:cover}
.vcard h3{margin:0 0 3px;font-size:18px}
.vcard .price{font-size:20px;margin:4px 0}
.vcard .seller-mini{margin-left:auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0 6px;font-size:13px}
.vcard .seller-mini .pill{background:var(--primary-50);color:var(--primary);font-weight:700;font-size:12px;padding:2px 12px;border-radius:999px}
@media (max-width:640px){.vcard .seller-mini{display:none}.vcard .thumb{width:104px}.vcard h3{font-size:15.5px}}
.safety{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--r);background:var(--primary-50);border:1px solid var(--primary-100);margin:10px 0 0;font-size:13.5px;color:var(--ink-2)}
.safety b{color:var(--primary);display:block;font-size:14px}
.safety .s-ic{width:40px;height:40px;border-radius:50%;background:var(--surface);color:var(--primary);display:grid;place-items:center;flex:none;box-shadow:var(--shadow-sm)}
.chat-body{flex:1;overflow-y:auto;padding:14px 4px;display:flex;flex-direction:column;gap:10px;background:var(--chat-bg);border-radius:var(--r);margin-top:10px;border:1px solid var(--line-2)}
.day{align-self:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px 14px;font-size:13px;font-weight:600;color:var(--ink-2)}
.msg-row{display:flex;gap:10px;align-items:flex-start;padding:0 10px}
.msg-row.me{justify-content:flex-end}
.msg-row .avatar{width:38px;height:38px;font-size:13px}
.bubble{max-width:min(78%,520px);padding:10px 14px 6px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm);font-size:15px;line-height:1.5;word-wrap:break-word;white-space:pre-wrap}
.msg-row.me .bubble{background:var(--chat-me);border-color:transparent;border-bottom-right-radius:4px}
.msg-row:not(.me) .bubble{border-top-left-radius:4px}
.bubble .time{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:11.5px;color:var(--ink-3);margin-top:2px}
.bubble .time .ic{color:#2F80ED}
.bubble .imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;margin:2px 0 4px;min-width:min(440px,60vw)}
.bubble .imgs button{aspect-ratio:4/3;border-radius:8px;overflow:hidden}
.bubble .imgs button>*{width:100%;height:100%;object-fit:cover}
.typing{display:inline-flex;gap:4px;padding:6px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.composer{display:flex;align-items:center;gap:10px;padding:10px 0}
.composer .box{flex:1;display:flex;align-items:center;gap:8px;height:52px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 8px 0 18px}
.composer input[type=text]{flex:1;border:0;outline:0;background:transparent;font-size:15px;min-width:0}
.send{width:52px;height:52px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 6px 14px rgba(229,25,77,.3)}
.attach{width:44px;height:44px;border-radius:50%;color:var(--primary);display:grid;place-items:center}
.quick{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-top:8px}
.quick::-webkit-scrollbar{display:none}
.quick button{height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--primary-100);background:var(--primary-50);color:var(--primary);font-size:13px;font-weight:600;white-space:nowrap}
.emoji-pop{position:absolute;bottom:62px;right:60px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);padding:8px;display:grid;grid-template-columns:repeat(8,1fr);gap:2px;z-index:20}
.emoji-pop button{font-size:22px;width:36px;height:36px;border-radius:8px}
.emoji-pop button:hover{background:var(--line-2)}
.pending-imgs{display:flex;gap:8px;padding-top:8px}
.pending-imgs div{position:relative;width:62px;height:62px;border-radius:10px;overflow:hidden}
.pending-imgs img{width:100%;height:100%;object-fit:cover}
.pending-imgs button{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}

/* ---------- Messages list ---------- */
.conv{display:flex;gap:14px;padding:12px;align-items:center;border-bottom:1px solid var(--line-2);transition:background .15s}
.conv:hover{background:var(--surface-2)}
.conv .thumb{width:76px;height:58px;border-radius:10px;overflow:hidden;flex:none}
.conv .thumb>*{width:100%;height:100%;object-fit:cover}
.conv .mid{flex:1;min-width:0}
.conv h4{margin:0;font-size:15px;display:flex;justify-content:space-between;gap:8px}
.conv h4 small{font-weight:500;color:var(--ink-3);font-size:12px;flex:none}
.conv .who{font-size:13px;color:var(--ink-2);font-weight:600}
.conv .last{font-size:13.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv.unread .last{color:var(--ink);font-weight:600}
.ubadge{background:var(--primary);color:#fff;font-size:11.5px;font-weight:700;min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;padding:0 6px}

/* ---------- Finance ---------- */
.perks{display:grid;grid-template-columns:repeat(4,1fr);padding:16px 6px;background:var(--primary-50);border-color:var(--primary-100);margin:14px 0}
.perk{text-align:center;padding:4px 10px;font-size:12.5px;color:var(--ink-2);line-height:1.35}
.perk+.perk{border-left:1px solid var(--primary-100)}
.perk .p-ic{width:48px;height:48px;border-radius:50%;background:var(--surface);color:var(--primary);display:grid;place-items:center;margin:0 auto 8px;box-shadow:var(--shadow-sm)}
.perk b{display:block;color:var(--ink);font-size:14px;margin-bottom:2px}
@media (max-width:560px){.perks{grid-template-columns:1fr 1fr;row-gap:14px}.perk:nth-child(3){border-left:0}}
.important{display:flex;gap:12px;padding:14px 16px;border-radius:12px;background:var(--amber-50);border:1px solid color-mix(in srgb,var(--amber) 35%,transparent);font-size:13.5px;color:var(--ink-2);margin:6px 0 16px}
.important .ic{color:#D98300;flex:none}
.emi{padding:16px 18px;margin-bottom:14px}
.emi input[type=range]{width:100%;accent-color:var(--primary)}
.emi .row{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink-2);margin-top:2px}
.emi .big{font-size:26px;font-weight:800;color:var(--ink);letter-spacing:-.02em}

/* ---------- Thank you ---------- */
.ty{max-width:620px;margin:0 auto;text-align:center;padding:30px 10px}
.ty .burst{width:200px;height:200px;margin:0 auto;position:relative;display:grid;place-items:center}
.ty .burst .ring{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#E8F9EE 0,#F2FCF5 60%,transparent 70%)}
.ty .burst .ok{width:96px;height:96px;border-radius:50%;background:#22C55E;color:#fff;display:grid;place-items:center;position:relative;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.ty .burst i{position:absolute;width:12px;height:3px;border-radius:2px}
.ty h1{font-size:40px;margin:6px 0 4px;letter-spacing:-.025em}
.ty .divider{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--primary);margin:16px 0}
.ty .divider::before,.ty .divider::after{content:"";width:60px;height:2px;background:var(--primary-100)}

/* ---------- Sell ---------- */
.stepper{display:flex;gap:8px;margin:6px 0 20px}
.stepper div{flex:1}
.stepper .bar{height:5px;border-radius:3px;background:var(--line)}
.stepper .on .bar{background:var(--primary)}
.stepper small{display:block;margin-top:6px;font-size:12.5px;font-weight:600;color:var(--ink-3)}
.stepper .on small{color:var(--ink)}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.pick{border:1.5px solid var(--line);border-radius:var(--r);padding:10px;text-align:center;font-weight:600;font-size:13.5px;background:var(--surface);transition:border-color .15s}
.pick:hover{border-color:var(--ink-3)}
.pick.on{border-color:var(--primary);background:var(--primary-50);color:var(--primary)}
.pick svg{height:54px;width:100%;margin-bottom:6px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.photos .ph{aspect-ratio:4/3;border-radius:12px;overflow:hidden;position:relative;background:var(--line-2)}
.photos .ph img{width:100%;height:100%;object-fit:cover}
.photos .ph button{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.photos .ph .cover{position:absolute;left:6px;bottom:6px;background:var(--primary);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
.photos label.add{aspect-ratio:4/3;border-radius:12px;border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink-2);font-size:13px;font-weight:600;cursor:pointer}
.photos label.add:hover{border-color:var(--primary);color:var(--primary)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:36px;height:36px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line)}
.swatches button.on{box-shadow:0 0 0 2.5px var(--primary)}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.checks label{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;cursor:pointer;background:var(--surface)}
.checks input{accent-color:var(--primary);width:18px;height:18px}
@media (max-width:520px){.checks{grid-template-columns:1fr}}
.preview-wrap{border-radius:var(--r);overflow:hidden;aspect-ratio:16/9;max-width:460px}

/* ---------- Profile ---------- */
.prof-head{padding:22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.prof-head .avatar{width:76px;height:76px;font-size:26px}
.prof-head h2{margin:0;font-size:22px;display:flex;align-items:center;gap:6px}
.stats{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap}
.stat{padding:10px 16px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);text-align:center;min-width:92px}
.stat b{display:block;font-size:20px}
.stat small{color:var(--ink-2);font-size:12.5px;font-weight:600}
.ptabs{display:flex;gap:6px;overflow-x:auto;margin:18px 0 12px;scrollbar-width:none}
.my-row{display:flex;gap:14px;padding:12px;align-items:center;margin-bottom:10px}
.my-row .thumb{width:110px;aspect-ratio:4/3;border-radius:10px;overflow:hidden;flex:none}
.my-row .thumb>*{width:100%;height:100%;object-fit:cover}
.my-row .mid{flex:1;min-width:0}
.my-row h4{margin:0 0 2px;font-size:15.5px}
.my-row .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.status{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px}
.status.active{background:var(--green-50);color:var(--green)} .status.sold{background:var(--line-2);color:var(--ink-2)}
.status.new{background:var(--amber-50);color:#C27500} .status.contacted{background:var(--blue-50);color:var(--blue)}
@media (max-width:600px){.my-row{flex-wrap:wrap}.my-row .acts{width:100%;justify-content:flex-start}}
.set-row{display:flex;align-items:center;gap:14px;padding:16px 18px;border-bottom:1px solid var(--line-2);width:100%;text-align:left}
.set-row:last-child{border-bottom:0}
.set-row .s-ic{width:40px;height:40px;border-radius:10px;background:var(--primary-50);color:var(--primary);display:grid;place-items:center}
.set-row .grow{flex:1}
.set-row small{display:block;color:var(--ink-3);font-size:13px}
.toggle{width:46px;height:26px;border-radius:13px;background:var(--line);position:relative;transition:background .2s;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on{background:var(--primary)}.toggle.on::after{transform:translateX(20px)}

/* ---------- Notifications ---------- */
.noti{display:flex;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line-2);align-items:flex-start}
.noti.unread{background:var(--primary-50)}
.noti .n-ic{width:42px;height:42px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--primary);display:grid;place-items:center;flex:none}
.noti b{display:block;font-size:14.5px}
.noti p{margin:2px 0;font-size:13.5px;color:var(--ink-2)}
.noti small{color:var(--ink-3);font-size:12px}

/* ---------- Toast / lightbox ---------- */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 24px);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#101B3B;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;animation:up .25s}
.toast.ok .ic{color:#4ADE80}.toast.bad .ic{color:#FB7185}
.lightbox{position:fixed;inset:0;background:rgba(5,8,20,.92);z-index:90;display:grid;place-items:center;padding:20px}
.lightbox>div{width:min(1000px,100%);aspect-ratio:16/10;border-radius:14px;overflow:hidden}
.lightbox>div>*{width:100%;height:100%;object-fit:contain;background:#000}
.lightbox .x{position:absolute;top:18px;right:18px;color:#fff;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center}
.spin{width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.menu-pop{position:absolute;right:0;top:48px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);min-width:200px;padding:6px;z-index:50}
.menu-pop button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:8px;font-size:14px;font-weight:600;text-align:left}
.menu-pop button:hover{background:var(--line-2)}
.drawer{position:fixed;inset:0 auto 0 0;width:min(320px,86vw);background:var(--surface);z-index:85;padding:22px 16px;animation:sl .25s;overflow:auto}
@keyframes sl{from{transform:translateX(-100%)}}
.drawer a{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;font-weight:600}
.drawer a:hover{background:var(--line-2)}
.footer{color:var(--ink-3);font-size:13px;text-align:center;padding:26px 0 6px}
</style>
</head>

function ago(ts){
  const s = Math.max(1, (Date.now()-ts)/1000);
  if (s < 60) return 'just now';
  const m = s/60; if (m < 60) return Math.floor(m) + (Math.floor(m)===1?' min ago':' mins ago');
  const h = m/60; if (h < 24) return Math.floor(h) + (Math.floor(h)===1?' hour ago':' hours ago');
  const d = h/24; if (d < 30) return Math.floor(d) + (Math.floor(d)===1?' day ago':' days ago');
  const mo = d/30; if (mo < 12) return Math.floor(mo) + (Math.floor(mo)===1?' month ago':' months ago');
  return Math.floor(mo/12) + ' yr ago';
}
const clock = ts => new Date(ts).toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit',hour12:true}).toUpperCase();
const dateLong = ts => new Date(ts).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}) + ', ' + clock(ts);
const monthYear = ts => new Date(ts).toLocaleDateString('en-IN',{month:'short',year:'numeric'});
function dayLabel(ts){
  const d = new Date(ts), t = new Date(); const y = new Date(); y.setDate(t.getDate()-1);
  if (d.toDateString()===t.toDateString()) return 'Today';
  if (d.toDateString()===y.toDateString()) return 'Yesterday';
  return d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
}
function shade(hex, amt){
  let c = hex.replace('#',''); if (c.length===3) c=[...c].map(x=>x+x).join('');
  const n = parseInt(c,16); let r=n>>16, g=(n>>8)&255, b=n&255;
  const f = v => Math.max(0,Math.min(255, Math.round(amt<0 ? v*(1+amt) : v+(255-v)*amt)));
  return '#' + [f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,'0')).join('');
}

  const bodies = {

/* Render an image reference: uploaded data-URL, or generated art "art:<listingId>:<view>" */
function artFor(l, view='side'){
  const inner = VA.draw(l.category, l.subtype, l.color, l.tyres);
  switch(view){
    case 'cab': return VA.scene(inner, {crop:'160 84 150 94'});
    case 'dusk': return VA.scene(inner, {bg:'dusk'});
    case 'flip': return VA.scene(inner, {bg:'cloud', flip:true});
    case 'rear': return VA.rear(l.color, l.subtype);
    case 'interior': return VA.interior(l.category);
    default: return VA.scene(inner);
  }
}
const ART_VIEWS = ['side','flip','rear','interior','cab','dusk'];
function imgsOf(l){ return (l.photos && l.photos.length) ? l.photos : ART_VIEWS.map(v=>'art:'+l.id+':'+v); }
function renderImg(ref, alt=''){
  if (!ref) return '';
  if (ref.startsWith('art:')){
    const [,id,view] = ref.split(':'); const l = API.listings.get(id);
    return l ? artFor(l, view) : '';
  }
  return `<img src="${esc(ref)}" alt="${esc(alt)}" loading="lazy">`;
}

};
const HIGHLIGHT_OPTIONS = ['Excellent Running Condition','Regularly Serviced','New Tyres','Heavy Body with Strong Cabin','Tipper Body in Good Condition','Ready to Work – No Work Required','Insurance Valid','Fitness Certificate Valid','National Permit','Loan Available','Single Owner','Accident Free'];
const SWATCHES = ['#F3F4F7','#1F5FD1','#E9B21C','#D63A2F','#1BA39C','#E2541B','#2F8F3A','#7C3AED','#222831','#A63A2B'];

/* ------------------------ SERVER-BACKED STORE ----------------------- */
/* All data lives in the Express/SQLite server. The browser keeps a read cache (Store)
   that is hydrated from /api/bootstrap and polled, so views can stay synchronous. */
class ApiError extends Error { constructor(msg, field){ super(msg); this.field = field; } }

const Store = { ready:false, me:null, demo:false, formFields:[], users:{}, listings:[], favorites:[], chats:[], messages:[], notifications:[], finance:[], ls:0, ms:0, skew:0 };
const serverNow = () => Date.now() + Store.skew;

async function http(method, url, body){
  let res;
  try {
    res = await fetch(url, { method, credentials:'same-origin', headers: body!==undefined ? {'Content-Type':'application/json'} : {}, body: body!==undefined ? JSON.stringify(body) : undefined });
  } catch(e){ throw new ApiError('Cannot reach the server. Check your connection and try again.'); }
  let data = null; try { data = await res.json(); } catch(e){}
  if (!res.ok){
    if (res.status === 401 && Store.me && !url.startsWith('/api/auth/')){ Store.me = null; Sync.reset(); }
    throw new ApiError((data && data.error) || `Request failed (${res.status})`, data && data.field);
  }
  return data;
}

const Sync = {
  inflight:null,
  /* merge a /api/bootstrap payload into the cache; returns what changed so the UI can refresh */
  apply(d){
    const prevMe = Store.me && Store.me.id, prevMsgs = Store.messages.length, prevNoti = Store.notifications.length, prevChats = Store.chats.length;
    Store.skew = d.now - Date.now(); if (d.formFields) Store.formFields = d.formFields; Store.demo = !!d.demo; Store.me = d.user;
    Store.users = {}; (d.users||[]).forEach(u => Store.users[u.id] = u);
    const keep = new Set(d.listingIds), byId = new Map(Store.listings.filter(l => keep.has(l.id)).map(l => [l.id, l]));
    d.listings.forEach(l => { const old = byId.get(l.id); byId.set(l.id, old ? {...l, views:Math.max(l.views, old.views||0)} : l); });
    Store.listings = [...byId.values()];
    d.listings.forEach(l => { if (l.updatedAt > Store.ls) Store.ls = l.updatedAt; });
    Store.chats = d.chats || []; Store.favorites = d.favorites || []; Store.notifications = d.notifications || []; Store.finance = d.finance || [];
    const chatIds = new Set(Store.chats.map(c => c.id)), msgs = new Map(Store.messages.filter(m => chatIds.has(m.chatId)).map(m => [m.id, m]));
    (d.messages||[]).forEach(m => { msgs.set(m.id, m); if (m.createdAt > Store.ms) Store.ms = m.createdAt; });
    Store.messages = [...msgs.values()];
    Store.ready = true;
    return { signedOut: !!prevMe && !Store.me, newMsgs: Store.messages.length !== prevMsgs, newNoti: Store.notifications.length !== prevNoti, chatsChanged: Store.chats.length !== prevChats };
  },
  pull(){
    if (!this.inflight) this.inflight = http('GET', `/api/bootstrap?ls=${Store.ls}&ms=${Store.ms}`).then(d => { const ch = this.apply(d); this.ui(ch); return ch; }).finally(() => { this.inflight = null; });
    return this.inflight;
  },
  async reset(){ Store.ls = 0; Store.ms = 0; Store.listings = []; Store.messages = []; try { await this.pull(); } catch(e){} },
  ui(ch){
    if (!window.App || !App.started) return;
    if (ch.signedOut){ toast('You have been signed out','bad'); App.render(); return; }
    App.refreshBadges();
    const h = location.hash;
    if (ch.newMsgs && h.startsWith('#/chat/') && App.chatDraw) App.chatDraw();
    else if ((ch.newMsgs || ch.newNoti || ch.chatsChanged) && (h === '#/messages' || h === '#/notifications')) App.render();
  },
};

const API = (() => {
  const meId = () => Store.me ? Store.me.id : null;
  const requireMe = () => { if (!meId()) throw new ApiError('Please log in to continue'); return meId(); };
  const putListing = l => { const i = Store.listings.findIndex(x => x.id === l.id); if (i >= 0) Store.listings[i] = l; else Store.listings.push(l); return l; };
  const GONE = id => ({id, name:'Deleted user', color:'#9CA3AF', createdAt:0, verified:false, city:'', state:'', business:'', rating:0, reviews:0, deleted:true});

  /* ---- auth ---- */
  const auth = {
    me: () => Store.me,
    isOwner: () => !!Store.me && Store.me.role === 'owner',
    async register(d){ const r = await http('POST', '/api/auth/register', d); await Sync.reset(); return r.user; },
    async login({id, password, as}){ const r = await http('POST', '/api/auth/login', {id, password, as}); await Sync.reset(); return r.user; },
    async demo(){ return auth.login({id:'demo@spidy.in', password:'demo1234', as:'user'}); },
    async logout(){ try { await http('POST', '/api/auth/logout'); } catch(e){} Store.me = null; await Sync.reset(); },
    async update(patch){ const r = await http('PATCH', '/api/auth/me', patch); await Sync.pull(); return r.user; },
    async changePassword(oldPw, newPw){ await http('POST', '/api/auth/password', {old:oldPw, new:newPw}); },
    user: id => Store.users[id] || GONE(id),
  };

  /* ---- listings ---- */
  function matches(l, f){
    if (f.status !== 'any' && l.status !== (f.status||'active')) return false;
    if (f.category && l.category !== f.category) return false;
    if (f.subtype && l.subtype !== f.subtype) return false;
    if (f.brand && l.brand !== f.brand) return false;
    if (f.sellerId && l.sellerId !== f.sellerId) return false;
    if (f.priceMin && l.price < f.priceMin) return false;
    if (f.priceMax && l.price > f.priceMax) return false;
    if (f.yearMin && l.year < f.yearMin) return false;
    if (f.state && l.state !== f.state) return false;
    if (f.emission && f.emission.length && !f.emission.includes(l.emission)) return false;
    if (f.tyres && f.tyres.length && !f.tyres.some(t => t==='12+' ? l.tyres>=12 : l.tyres===+t)) return false;
    if (f.fuel && l.fuel !== f.fuel) return false;
    if (f.q){
      const hay = [l.title,l.brand,l.model,l.city,l.state,typeLabel(l),catById(l.category)?.name,l.emission,l.year].join(' ').toLowerCase();
      if (!f.q.toLowerCase().split(/\s+/).filter(Boolean).every(t=>hay.includes(t))) return false;
    }
    return true;
  }
  const SORTS = {
    latest:(a,b)=>b.createdAt-a.createdAt, priceAsc:(a,b)=>a.price-b.price, priceDesc:(a,b)=>b.price-a.price,
    yearDesc:(a,b)=>b.year-a.year||b.createdAt-a.createdAt, kmAsc:(a,b)=>a.km-b.km,
  };
  const listings = {
    async query(f={}){ await Sync.pull().catch(()=>{}); return listings.querySync(f); },
    querySync: (f={}) => Store.listings.filter(l=>matches(l,f)).sort(SORTS[f.sort||'latest']||SORTS.latest),
    count: (f={}) => Store.listings.filter(l=>matches(l,f)).length,
    get: id => Store.listings.find(l=>l.id===id),
    view(id){ const l = listings.get(id); if (l) l.views = (l.views||0) + 1; http('POST', `/api/listings/${encodeURIComponent(id)}/view`).catch(()=>{}); },
    async create(d){ requireMe(); const r = await http('POST', '/api/listings', d); return putListing(r.listing); },
    async update(id, d){ const r = await http('PATCH', `/api/listings/${encodeURIComponent(id)}`, d); return putListing(r.listing); },
    async setStatus(id, status){ const r = await http('POST', `/api/listings/${encodeURIComponent(id)}/status`, {status}); return putListing(r.listing); },
    async remove(id){ await http('DELETE', `/api/listings/${encodeURIComponent(id)}`); Store.listings = Store.listings.filter(x=>x.id!==id); Store.favorites = Store.favorites.filter(x=>x!==id); },
    brandCounts(f){ const m={}; Store.listings.filter(l=>matches(l,{...f, brand:null})).forEach(l=>m[l.brand]=(m[l.brand]||0)+1); return m; },
  };

  /* ---- favorites (optimistic) ---- */
  const favs = {
    ids: () => Store.favorites,
    has: lid => Store.favorites.includes(lid),
    toggle(lid){
      requireMe(); const on = !favs.has(lid);
      Store.favorites = on ? [...Store.favorites, lid] : Store.favorites.filter(x=>x!==lid);
      http('POST', `/api/favorites/${encodeURIComponent(lid)}/toggle`).catch(e => {
        Store.favorites = on ? Store.favorites.filter(x=>x!==lid) : [...Store.favorites, lid];
        $$(`[data-fav="${lid}"]`).forEach(b=>{ b.classList.toggle('on', !on); b.setAttribute('aria-pressed', !on); });
        toast(e.message, 'bad');
      });
      return on;
    },
    list: () => Store.listings.filter(l => Store.favorites.includes(l.id)),
  };

  /* ---- notifications ---- */
  const notify = {
    list: () => Store.notifications,
    unread: () => Store.notifications.filter(n=>!n.read).length,
    readAll(){ Store.notifications.forEach(n=>n.read=true); http('POST', '/api/notifications/read-all').catch(()=>{}); },
    read(id){ const n = Store.notifications.find(x=>x.id===id); if (n) n.read = true; http('POST', `/api/notifications/${encodeURIComponent(id)}/read`).catch(()=>{}); },
  };

  /* ---- chats ---- */
  const typing = {};
  const chats = {
    typing,
    async open(listingId){ const r = await http('POST', '/api/chats', {listingId}); await Sync.pull(); return r.id; },
    mine: () => [...Store.chats].sort((a,b)=>b.updatedAt-a.updatedAt),
    get: id => Store.chats.find(c=>c.id===id),
    messages: id => Store.messages.filter(m=>m.chatId===id).sort((a,b)=>a.createdAt-b.createdAt),
    last(id){ const m = chats.messages(id); return m[m.length-1]; },
    unreadIn(c){ const me = meId(); return Store.messages.filter(m => m.chatId===c.id && m.senderId!==me && m.createdAt > (c.lastRead||0)).length; },
    unreadTotal: () => Store.chats.reduce((s,c)=>s+chats.unreadIn(c), 0),
    markRead(id){ const c = chats.get(id); if (!c || !chats.unreadIn(c)) return; c.lastRead = serverNow(); http('POST', `/api/chats/${encodeURIComponent(id)}/read`).catch(()=>{}); },
    async send(id, {text='', images=[]}){
      requireMe(); text = text.trim(); if (!text && !images.length) return;
      if (text.length > 1000) throw new ApiError('Messages can be up to 1000 characters');
      const c = chats.get(id); if (!c) throw new ApiError('Conversation not found');
      const r = await http('POST', `/api/chats/${encodeURIComponent(id)}/messages`, {text, images});
      Store.messages.push(r.message); c.updatedAt = r.message.createdAt; c.lastRead = r.message.createdAt;
      if (r.message.createdAt > Store.ms) Store.ms = r.message.createdAt;
      const other = API.auth.user(c.buyerId===meId() ? c.sellerId : c.buyerId);
      if (other.isBot) chats._awaitReply(id, r.message.createdAt);
      return r.message;
    },
    /* demo dealers reply automatically: show "typing…" and poll quickly until the reply lands */
    async _awaitReply(id, since){
      typing[id] = true; App.onChatEvent(id);
      for (let i = 0; i < 12 && typing[id]; i++){
        await sleep(900); try { await Sync.pull(); } catch(e){}
        if (Store.messages.some(m => m.chatId===id && m.senderId!==meId() && m.createdAt > since)) break;
      }
      typing[id] = false; App.onChatEvent(id);
    },
    async remove(id){ await http('DELETE', `/api/chats/${encodeURIComponent(id)}`); Store.chats = Store.chats.filter(c=>c.id!==id); Store.messages = Store.messages.filter(m=>m.chatId!==id); },
  };

  /* ---- finance ---- */
  const finance = {
    async submit(d){ const r = await http('POST', '/api/finance', d); Store.finance.unshift(r.request); await Sync.pull().catch(()=>{}); return r.request; },
    mine: () => Store.finance,
  };

  /* ---- owner console ---- */
  const qs = o => { const p = new URLSearchParams(); Object.entries(o).forEach(([k,v])=>{ if (v) p.set(k, v); }); const s = p.toString(); return s ? '?'+s : ''; };
  const owner = {
    overview: () => http('GET', '/api/owner/overview'),
    users: q => http('GET', '/api/owner/users' + qs({q})).then(r=>r.users),
    patchUser: (id, patch) => http('PATCH', `/api/owner/users/${encodeURIComponent(id)}`, patch),
    deleteUser: id => http('DELETE', `/api/owner/users/${encodeURIComponent(id)}`),
    listings: (q, status) => http('GET', '/api/owner/listings' + qs({q, status})).then(r=>r.listings),
    patchListing: (id, status) => http('PATCH', `/api/owner/listings/${encodeURIComponent(id)}`, {status}),
    deleteListing: id => http('DELETE', `/api/owner/listings/${encodeURIComponent(id)}`),
    finance: () => http('GET', '/api/owner/finance').then(r=>r.requests),
    formFields: () => http('GET', '/api/owner/form-fields').then(r => (Store.formFields = r.fields)),
    addField: p => http('POST', '/api/owner/form-fields', p).then(r => (Store.formFields = r.fields)),
    patchField: (key, p) => http('PATCH', `/api/owner/form-fields/${encodeURIComponent(key)}`, p).then(r => (Store.formFields = r.fields)),
    moveField: (key, dir) => http('POST', `/api/owner/form-fields/${encodeURIComponent(key)}/move`, {dir}).then(r => (Store.formFields = r.fields)),
    deleteField: key => http('DELETE', `/api/owner/form-fields/${encodeURIComponent(key)}`).then(r => (Store.formFields = r.fields)),
    patchFinance: (id, status) => http('PATCH', `/api/owner/finance/${encodeURIComponent(id)}`, {status}),
  };

  return { auth, listings, favs, notify, chats, finance, owner, meId };
})();


/* ---------------------------- UI HELPERS ---------------------------- */
function toast(msg, type='ok'){
  const el = document.createElement('div'); el.className = 'toast ' + type;
  el.innerHTML = I(type==='bad'?'info':'checkCircle','sm') + `<span>${esc(msg)}</span>`;
  $('#toast').appendChild(el); setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 2600);
}
function openSheet(html, mount){
  const ov = document.createElement('div'); ov.className='overlay';
  ov.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  const close = () => { ov.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if(e.key==='Escape') close(); };
  ov.addEventListener('click', e => { if (e.target===ov) close(); });
  document.addEventListener('keydown', onKey);
  $('#layer').appendChild(ov); mount && mount(ov.firstElementChild, close);
  return close;
}
function confirmSheet({title, body, ok='Confirm', danger=false}){
  return new Promise(res => {
    openSheet(`<h3>${esc(title)}</h3><p class="muted" style="margin:0">${esc(body)}</p><div class="sheet-foot"><button class="btn btn-ghost" style="flex:1" data-no>Cancel</button><button class="btn btn-primary" style="flex:1" data-yes>${esc(ok)}</button></div>`,
      (el, close) => { $('[data-no]',el).onclick=()=>{close();res(false)}; $('[data-yes]',el).onclick=()=>{close();res(true)}; });
  });
}
function lightbox(refs, i=0){
  const ov = document.createElement('div'); ov.className='lightbox';
  const draw = () => { ov.innerHTML = `<button class="x" aria-label="Close">${I('x')}</button><div>${renderImg(refs[i])}</div>${refs.length>1?`<button class="g-nav l" aria-label="Previous">${I('left')}</button><button class="g-nav r" aria-label="Next">${I('right')}</button>`:''}`;
    $('.x',ov).onclick=close; const l=$('.g-nav.l',ov), r=$('.g-nav.r',ov);
    if(l){ l.onclick=e=>{e.stopPropagation(); i=(i-1+refs.length)%refs.length; draw();}; r.onclick=e=>{e.stopPropagation(); i=(i+1)%refs.length; draw();}; } };
  const close = () => { ov.remove(); document.removeEventListener('keydown', key); };
  const key = e => { if(e.key==='Escape') close(); if(e.key==='ArrowRight'&&refs.length>1){i=(i+1)%refs.length;draw();} if(e.key==='ArrowLeft'&&refs.length>1){i=(i-1+refs.length)%refs.length;draw();} };
  ov.addEventListener('click', e=>{ if(e.target===ov) close(); }); document.addEventListener('keydown', key);
  draw(); $('#layer').appendChild(ov);
}

function heroScene(v){
  const id = svgId();
  const sky = [['#7DB8E8','#CFE6F7','#F4E9D8'],['#F2A47A','#F8CFAE','#FBE6D4'],['#8EC5EA','#D8ECF8','#EEF6FB'],['#6FA9DB','#C3DDF2','#EAF2F8']][v];
  let sk=''; let x=300; let seed=7+v*13;
  const rnd = () => (seed = (seed*9301+49297)%233280)/233280;
  while(x<1000){ const w=26+rnd()*44, h=90+rnd()*170; sk+=`<rect x="${x}" y="${300-h}" width="${w}" height="${h}" fill="${v===1?'#C9A597':'#9DB7CE'}" opacity="${.5+rnd()*.35}"/>`;
    for(let yy=300-h+8; yy<290; yy+=14) sk+=`<rect x="${x+5}" y="${yy}" width="${w-10}" height="3" fill="#fff" opacity=".25"/>`; x+=w+4+rnd()*10; }
  const crane = `<g stroke="#D9A21B" stroke-width="5" fill="none"><path d="M880 300 V70"/><path d="M760 76 H990"/><path d="M880 70 L830 76 M880 70 L940 76"/><path d="M960 76 V150"/></g><rect x="860" y="60" width="30" height="18" fill="#D9A21B"/>`;
  const sets = [
    [['trucks','lorries','#F3F4F7',330,240,1.05],['mini-trucks',null,'#E9B21C',500,262,.85],['tractors',null,'#D62B2B',600,238,.95],['buses',null,'#E5194D',700,218,1.1],['construction',null,'#F2B705',820,214,1],['farm',null,'#2F8F3A',900,236,.92],['three-wheeler',null,'#F5C400',955,272,.7]],
    [['trucks','tippers','#E9B21C',420,226,1.25],['trucks','trailers','#A63A2B',650,218,1.35]],
    [['trucks','tankers','#E5194D',400,232,1.15],['trucks','lorries','#1F5FD1',620,228,1.2],['mini-trucks',null,'#3B82F6',840,262,.95]],
    [['construction',null,'#F2B705',430,222,1.2],['trucks','tippers','#D63A2F',650,226,1.25],['trucks','special','#D62B2B',860,250,.95]],
  ][v];
  const veh = sets.map(([c,s,col,x,y,sc]) => `<g transform="translate(${x-120*sc} ${y-60*sc}) scale(${sc})">${VA.draw(c,s,col,10)}</g>`).join('');
  return `<svg class="scene" viewBox="0 0 1000 420" preserveAspectRatio="xMaxYMid slice" aria-hidden="true">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky[0]}"/><stop offset=".65" stop-color="${sky[1]}"/><stop offset="1" stop-color="${sky[2]}"/></linearGradient></defs>
    <rect width="1000" height="420" fill="url(#${id})"/>${v===1?'<circle cx="760" cy="120" r="46" fill="#FFE3AE" opacity=".9"/>':''}
    ${sk}${v===0||v===3?crane:''}
    <rect y="296" width="1000" height="14" fill="#86B27A"/><rect y="310" width="1000" height="110" fill="#6E727C"/><rect y="310" width="1000" height="4" fill="#C3C8D0"/>
    <g fill="#ECEFF3">${[20,140,260,380,500,620,740,860,980].map(x=>`<rect x="${x}" y="392" width="70" height="5" rx="2"/>`).join('')}</g>
    <g transform="translate(0 40)">${veh}</g></svg>`;
}

const PRICE_PRESETS = [['Under ₹5 L',0,500000],['₹5–15 L',500000,1500000],['₹15–30 L',1500000,3000000],['Above ₹30 L',3000000,0]];
function parseFilters(q){
  return { brand:q.get('brand')||null, sort:q.get('sort')||'latest', q:q.get('q')||'', category:q.get('cat')||null,
    priceMin:+q.get('pmin')||0, priceMax:+q.get('pmax')||0, yearMin:+q.get('ymin')||0, state:q.get('state')||null, fuel:q.get('fuel')||null,
    tyres:(q.get('tyres')||'').split(',').filter(Boolean), emission:(q.get('em')||'').split(',').filter(Boolean) };
}
function filterQuery(f){
  const p = new URLSearchParams();
  if (f.q) p.set('q', f.q); if (f.category) p.set('cat', f.category); if (f.brand) p.set('brand', f.brand);
  if (f.sort && f.sort!=='latest') p.set('sort', f.sort);
  if (f.priceMin) p.set('pmin', f.priceMin); if (f.priceMax) p.set('pmax', f.priceMax); if (f.yearMin) p.set('ymin', f.yearMin);
  if (f.state) p.set('state', f.state); if (f.fuel) p.set('fuel', f.fuel);
  if (f.tyres.length) p.set('tyres', f.tyres.join(',')); if (f.emission.length) p.set('em', f.emission.join(','));
  const s = p.toString(); return s ? '?' + s : '';
}
const activeFilterCount = f => [f.priceMin||f.priceMax, f.yearMin, f.state, f.fuel, f.tyres.length, f.emission.length].filter(Boolean).length;
function filterSheet(f, cat, onApply){
  const showTyres = !cat || ['trucks','mini-trucks','buses'].includes(cat);
  const y = new Date().getFullYear();
  const html = `<h3>Filters</h3>
    <div class="opt-group"><label>Price</label><div class="chips" data-presets>${PRICE_PRESETS.map(([n,a,b],i)=>`<button class="chip ${f.priceMin===a&&f.priceMax===b?'on':''}" data-p="${i}">${n}</button>`).join('')}</div>
      <div class="grid2" style="margin-top:10px"><input class="input" type="number" inputmode="numeric" placeholder="Min ₹" data-pmin value="${f.priceMin||''}"><input class="input" type="number" inputmode="numeric" placeholder="Max ₹" data-pmax value="${f.priceMax||''}"></div></div>
    <div class="opt-group"><label>Model year</label><div class="chips">${[[0,'Any'],[y-2,(y-2)+' & newer'],[y-5,(y-5)+' & newer'],[y-8,(y-8)+' & newer']].map(([v,n])=>`<button class="chip ${f.yearMin===v?'on':''}" data-y="${v}">${n}</button>`).join('')}</div></div>
    ${showTyres?`<div class="opt-group"><label>Tyres</label><div class="chips">${['4','6','10','12+'].map(t=>`<button class="chip ${f.tyres.includes(t)?'on':''}" data-t="${t}">${t} Tyres</button>`).join('')}</div></div>`:''}
    <div class="opt-group"><label>Emission norm</label><div class="chips">${['BS-IV','BS-VI'].map(t=>`<button class="chip ${f.emission.includes(t)?'on':''}" data-e="${t}">${t}</button>`).join('')}</div></div>
    <div class="opt-group"><label>Fuel</label><div class="chips">${['Diesel','CNG','Electric'].map(t=>`<button class="chip ${f.fuel===t?'on':''}" data-fu="${t}">${t}</button>`).join('')}</div></div>
    <div class="opt-group"><label for="fstate">State</label><select id="fstate" class="input"><option value="">All states</option>${STATES.map(s=>`<option ${f.state===s?'selected':''}>${s}</option>`).join('')}</select></div>
    <div class="sheet-foot"><button class="btn btn-ghost" style="flex:1" data-clear>Clear all</button><button class="btn btn-primary" style="flex:2" data-apply>Show results</button></div>`;
  openSheet(html, (el, close) => {
    const n = {...f, tyres:[...f.tyres], emission:[...f.emission]};
    const toggleOne = (attr, key) => $$(`[${attr}]`,el).forEach(b=>b.onclick=()=>{ const v=b.getAttribute(attr); n[key] = n[key]===v ? null : v; $$(`[${attr}]`,el).forEach(x=>x.classList.toggle('on', x.getAttribute(attr)===n[key])); });
    const toggleMany = (attr, key) => $$(`[${attr}]`,el).forEach(b=>b.onclick=()=>{ const v=b.getAttribute(attr); const s=new Set(n[key]); s.has(v)?s.delete(v):s.add(v); n[key]=[...s]; b.classList.toggle('on'); });
    $$('[data-p]',el).forEach(b=>b.onclick=()=>{ const [,a,c]=PRICE_PRESETS[+b.dataset.p]; $('[data-pmin]',el).value=a||''; $('[data-pmax]',el).value=c||''; $$('[data-p]',el).forEach(x=>x.classList.toggle('on',x===b)); });
    $$('[data-y]',el).forEach(b=>b.onclick=()=>{ n.yearMin=+b.dataset.y; $$('[data-y]',el).forEach(x=>x.classList.toggle('on',x===b)); });
    toggleMany('data-t','tyres'); toggleMany('data-e','emission'); toggleOne('data-fu','fuel');
    $('[data-clear]',el).onclick=()=>{ close(); onApply({...f, priceMin:0, priceMax:0, yearMin:0, state:null, fuel:null, tyres:[], emission:[]}); };
    $('[data-apply]',el).onclick=()=>{ n.priceMin=+$('[data-pmin]',el).value||0; n.priceMax=+$('[data-pmax]',el).value||0; n.state=$('#fstate',el).value||null;
      if (n.priceMin && n.priceMax && n.priceMin>n.priceMax){ toast('Minimum price is higher than maximum','bad'); return; } close(); onApply(n); };
  });
}

const EMOJIS = ['👍','🙏','😊','👌','🚚','✅','🤝','💰','📍','📞','😀','🔥','👀','⏰','📄','🛠️'];
Views.chat = ({id}) => {
  const me = API.meId(); const c = API.chats.get(id);
  if (!c || (c.buyerId!==me && c.sellerId!==me)) return Views.notFound('This conversation does not exist.');
  const l = API.listings.get(c.listingId) || {id:c.listingId, title:'Vehicle removed', price:0, year:'', tyres:0, emission:'', category:'trucks', subtype:'lorries', color:'#ccc', photos:[]};
  const otherId = c.buyerId===me ? c.sellerId : c.buyerId; const other = API.auth.user(otherId);
  const iAmSeller = c.sellerId===me;
  return { nav:'messages', chat:true, html: `${topbar({back:'#/messages', title:'Message with ' + (iAmSeller?'Buyer':'Seller'), sub:`Chat privately with the ${iAmSeller?'buyer':'seller'}`, right:`<span style="display:flex;align-items:center;gap:6px;color:var(--primary);font-weight:700;font-size:14px">${I('shieldCheck','sm')} <span class="hide-sm">Safe Chat</span></span><div style="position:relative"><button class="icon-btn" data-more aria-label="More">${I('menu')}</button></div>`})}
  <div class="wrap chat-page">
    <div class="chat-head">
      <div class="card vcard"><a class="thumb" href="#/v/${l.id}">${cover(l)}</a><div style="min-width:0"><h3>${esc(l.title)}</h3>${metaLine([String(l.year), l.tyres?l.tyres+' Tyres':null, l.emission, typeLabel(l)])}<div class="price">${inr(l.price)}</div><a href="#/v/${l.id}" class="link">View Vehicle Details ${I('right','xs')}</a></div>
        <div class="seller-mini"><span class="pill">${iAmSeller?'Buyer':'Seller'}</span>${avatar(other)}<b style="display:flex;align-items:center;gap:4px">${esc(other.name)} ${other.verified?`<span class="verified">${I('shieldCheck','xs')}</span>`:''}</b><span class="muted">Member since ${monthYear(other.createdAt)}</span></div></div>
      <div class="safety"><span class="s-ic">${I('shieldCheck')}</span><div><b>Your safety is our priority</b>Contact details are hidden for privacy. Share only if you are comfortable.</div></div>
    </div>
    <div class="chat-body" data-body aria-live="polite"></div>
    <div style="position:relative">
      <div class="quick" data-quick>${['Is it still available?','Can you share the condition and service history?','What is the final price?','Are all papers clear?','I will visit tomorrow.'].map(t=>`<button data-q="${esc(t)}">${esc(t)}</button>`).join('')}</div>
      <div class="pending-imgs" data-pending></div>
      <form class="composer" data-form>
        <label class="attach" title="Attach photos" style="cursor:pointer">${I('clip')}<input type="file" accept="image/*" multiple hidden data-file></label>
        <div class="box"><input type="text" data-input placeholder="Type your message..." aria-label="Message" maxlength="1000" autocomplete="off"><button type="button" class="icon-btn" data-emoji aria-label="Emoji">${I('smile')}</button></div>
        <button class="send" aria-label="Send">${I('send')}</button>
      </form>
    </div>
  </div>`,
  mount(root){
    const body = $('[data-body]', root); let pending = [];
    const draw = () => {
      const msgs = API.chats.messages(id); let lastDay = ''; let h = '';
      if (!msgs.length) h = `<div class="empty" style="padding:30px"><p>Say hello and ask about the vehicle. Your number stays hidden.</p></div>`;
      msgs.forEach(m => {
        const d = dayLabel(m.createdAt); if (d!==lastDay){ h+=`<div class="day">${d}</div>`; lastDay=d; }
        const mine = m.senderId===me; const u = mine ? null : other;
        h += `<div class="msg-row ${mine?'me':''}">${mine?'':avatar(u)}<div class="bubble">${m.images&&m.images.length?`<div class="imgs">${m.images.map((r,k)=>`<button data-img="${m.id}:${k}">${renderImg(r)}</button>`).join('')}</div>`:''}${m.text?esc(m.text):''}<div class="time">${clock(m.createdAt)}${mine?I('checks','xs'):''}</div></div></div>`;
      });
      if (API.chats.typing[id]) h += `<div class="msg-row">${avatar(other)}<div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div></div>`;
      body.innerHTML = h; body.scrollTop = body.scrollHeight;
      $$('[data-img]',body).forEach(b=>b.onclick=()=>{ const [mid,k]=b.dataset.img.split(':'); const m=msgs.find(x=>x.id===mid); lightbox(m.images,+k); });
      API.chats.markRead(id); App.refreshBadges();
    };
    App.chatDraw = draw; App.cleanup.push(()=>{ App.chatDraw=null; });
    draw();
    const input = $('[data-input]',root);
    const drawPending = () => { $('[data-pending]',root).innerHTML = pending.map((p,k)=>`<div><img src="${p}" alt=""><button type="button" data-rm="${k}" aria-label="Remove">${I('x','xs')}</button></div>`).join(''); $$('[data-rm]',root).forEach(b=>b.onclick=()=>{pending.splice(+b.dataset.rm,1);drawPending();}); };
    const send = async text => {
      try { await API.chats.send(id, {text, images:pending}); pending=[]; drawPending(); input.value=''; draw(); }
      catch(e){ toast(e.message,'bad'); }
    };
    $('[data-form]',root).onsubmit = e => { e.preventDefault(); send(input.value); input.focus(); };
    $$('[data-q]',root).forEach(b=>b.onclick=()=>send(b.dataset.q));
    $('[data-file]',root).onchange = async e => { for (const f of [...e.target.files].slice(0, 4-pending.length)) { try { pending.push(await compressImage(f, 900, .7)); } catch(er){ toast(er.message,'bad'); } } e.target.value=''; drawPending(); };
    $('[data-emoji]',root).onclick = ev => { ev.stopPropagation(); const ex=$('.emoji-pop',root); if(ex){ex.remove();return;}
      const pop=document.createElement('div'); pop.className='emoji-pop'; pop.innerHTML=EMOJIS.map(e=>`<button type="button">${e}</button>`).join('');
      pop.onclick=e=>{ if(e.target.tagName==='BUTTON'){ input.value+=e.target.textContent; input.focus(); } };
      $('[data-form]',root).parentElement.appendChild(pop); setTimeout(()=>document.addEventListener('click',function h(e){ if(!pop.contains(e.target)){pop.remove();document.removeEventListener('click',h);} }),0); };
    $('[data-more]',root).onclick = ev => { ev.stopPropagation(); const host=ev.currentTarget.parentElement; const ex=$('.menu-pop',host); if(ex){ex.remove();return;}
      const m=document.createElement('div'); m.className='menu-pop';
      m.innerHTML=`<button data-a="view">${I('eye','sm')} View vehicle</button>${iAmSeller?'':`<button data-a="fin">${I('bank','sm')} Check finance</button>`}<button data-a="clear">${I('trash','sm')} Delete conversation</button>`;
      host.appendChild(m);
      m.onclick = async e => { const a=e.target.closest('[data-a]')?.dataset.a; m.remove(); if(a==='view') go('#/v/'+l.id); if(a==='fin') go('#/finance/'+l.id);
        if(a==='clear' && await confirmSheet({title:'Delete this conversation?', body:'This conversation will be removed from your inbox. The other person keeps their copy.', ok:'Delete'})){ try { await API.chats.remove(id); toast('Conversation deleted'); go('#/messages'); } catch(er){ toast(er.message,'bad'); } } };
      setTimeout(()=>document.addEventListener('click',function h(){ m.remove(); document.removeEventListener('click',h); }),0); };
    if (matchMedia('(min-width:960px)').matches) input.focus();
  }};
};
