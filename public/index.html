/* ---- image compression for uploads (keeps requests small) ---- */
function compressImage(file, max=1000, q=.72){
  return new Promise((res, rej) => {
    if (!file.type.startsWith('image/')) return rej(new Error('Only image files can be added'));
    if (file.size > 15e6) return rej(new Error('Image is larger than 15 MB'));
    const fr = new FileReader();
    fr.onload = () => { const img = new Image(); img.onload = () => {
      const s = Math.min(1, max/Math.max(img.width, img.height)); const c = document.createElement('canvas');
      c.width = Math.round(img.width*s); c.height = Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg', q)); }; img.onerror=()=>rej(new Error('This image could not be read')); img.src = fr.result; };
    fr.onerror = () => rej(new Error('This image could not be read')); fr.readAsDataURL(file);
  });
}

/* ---- sell / edit ---- */
/* The form is driven by Store.formFields, which the owner edits in the owner console (Sell form tab). */
const FORM_GROUPS = ['vehicle','details','media','pricing'];
const FORM_TITLES = {vehicle:'Vehicle', details:'Details', media:'Photos', pricing:'Price & location'};
Views.sell = ({id}) => {
  const editing = id ? API.listings.get(id) : null;
  if (id && (!editing || editing.sellerId !== API.meId() || editing.status === 'removed')) return Views.notFound('You can only edit your own listings.');
  const DKEY = 'spidy_draft_' + API.meId();
  const me0 = API.auth.me();
  let d;
  if (editing) d = JSON.parse(JSON.stringify(editing));
  else { try { d = JSON.parse(localStorage.getItem(DKEY)); } catch(e){} }
  d = d || {category:'', subtype:'', brand:'', model:'', year:'', tyres:'', emission:'', fuel:'', transmission:'', km:'', regNo:'', engine:'', power:'', load:'', body:'', photos:[], color:'#F3F4F7', price:'', negotiable:true, city:me0.city||'', state:me0.state||'', description:'', highlights:['Excellent Running Condition','Regularly Serviced'], extras:{}};
  d.extras = d.extras || {}; d.photos = d.photos || []; d.highlights = d.highlights || [];
  let step = editing ? 2 : 1; // 1 = "What are you selling?", 2 = the form
  const saveDraft = () => { if (!editing) try { localStorage.setItem(DKEY, JSON.stringify({...d, photos:d.photos.slice(0,3)})); } catch(e){} };
  const spec = () => SPEC_DEFAULTS[d.category==='trucks' ? (d.subtype||'lorries') : (d.category||'lorries')] || SPEC_DEFAULTS.lorries;
  const isHours = () => HOURS_CATS.includes(d.category);
  const fieldsOn = () => Store.formFields.filter(f => f.enabled && !(f.key==='subtype' && d.category!=='trucks'))
    .sort((a,b) => FORM_GROUPS.indexOf(a.group)-FORM_GROUPS.indexOf(b.group) || a.sort-b.sort);
  const fieldByKey = k => Store.formFields.find(f => f.key===k);
  const getV = f => f.builtin ? d[f.key] : d.extras[f.key];
  const setV = (f, v) => { if (f.builtin) d[f.key] = v; else d.extras[f.key] = v; };
  const labelOf = f => f.key==='km' && f.label==='KM driven' ? (isHours() ? 'Hours used' : 'KM driven')
    : f.key==='load' && f.label==='Load capacity' && d.category==='buses' ? 'Seating' : f.label;
  const phOf = f => {
    if (f.placeholder) return f.placeholder; const sp = spec(), y = new Date().getFullYear();
    return {year:String(y-3), km:isHours()?'e.g. 2400':'e.g. 85000', regNo:'e.g. TS 07 UF 1234', engine:sp.engine, power:sp.power, load:sp.load, body:sp.body, price:'e.g. 1250000', city:'e.g. Khammam'}[f.key] || '';
  };
  const REQ = ' <span style="color:var(--primary)">*</span>';
  const field = (f, inner, wide) => `<div class="field" ${wide?'style="grid-column:1/-1"':''}><label for="s_${f.key}">${esc(labelOf(f))}${f.required?REQ:''}</label>${inner}<div class="err-msg" data-err="${f.key}" hidden></div></div>`;
  const options = (list, cur, blank) => (blank ? `<option value="">${esc(blank)}</option>` : '') + list.map(o => `<option value="${esc(o)}" ${String(cur)===String(o)?'selected':''}>${esc(o)}</option>`).join('');

  function fieldHtml(f){
    const v = getV(f) ?? '';
    switch (f.type){
      case 'subtype': return field(f, `<select class="input" id="s_subtype" data-fk="subtype"><option value="">Select ${esc(f.label.toLowerCase())}</option>${SUBS.map(s=>`<option value="${s.id}" ${d.subtype===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select>`);
      case 'brand': {
        const need = d.category==='trucks' && !d.subtype; const names = brandsFor(d.category, d.subtype||'lorries').map(b=>b[0]);
        if (d.brand && !names.includes(d.brand)) names.unshift(d.brand);
        return field(f, `<select class="input" id="s_brand" data-fk="brand" ${need?'disabled':''}>${options(names.map(n=>n), d.brand, need ? 'Select truck type first' : 'Select brand')}</select>`);
      }
      case 'text': {
        let extra = ''; let dl = '';
        if (f.key==='model'){ const series = (brandsFor(d.category, d.subtype||'lorries').find(b=>b[0]===d.brand)||[])[1]; extra = 'list="models"'; dl = `<datalist id="models">${(series||'').split(',').filter(Boolean).map(s=>`<option value="${esc(s)}">`).join('')}</datalist>`; }
        if (f.key==='regNo') extra = 'style="text-transform:uppercase"';
        return field(f, `<input class="input" id="s_${f.key}" data-fk="${f.key}" type="text" placeholder="${esc(f.key==='model' && !f.placeholder ? 'e.g. LPT 1613' : phOf(f))}" value="${esc(v)}" ${extra}>${dl}`);
      }
      case 'number': return field(f, `<input class="input" id="s_${f.key}" data-fk="${f.key}" type="number" inputmode="numeric" placeholder="${esc(phOf(f))}" value="${esc(v)}" min="0">`) + (f.key==='price' ? `<div class="muted" style="font-size:13px;grid-column:1/-1;margin-top:-6px" data-pricehint>${+d.price?`Shown as ${inr(d.price)} (${inrShort(+d.price)})`:''}</div>` : '');
      case 'textarea': return field(f, `<textarea class="input" id="s_${f.key}" data-fk="${f.key}" maxlength="1200" placeholder="${esc(f.placeholder || (f.key==='description' ? 'Condition, service history, papers, reason for selling…' : ''))}">${esc(v)}</textarea>`, true);
      case 'select': {
        let list = f.options.slice(); if (v && !list.includes(v)) list.unshift(v);
        if (f.builtin && !v && list.length){ const def = {emission:'BS-VI',fuel:'Diesel',transmission:'Manual'}[f.key]; setV(f, list.includes(def) ? def : list[0]); }
        return field(f, `<select class="input" id="s_${f.key}" data-fk="${f.key}">${options(list, getV(f), f.builtin ? '' : 'Select…')}</select>`);
      }
      case 'tyres': {
        const opts = d.category==='three-wheeler' ? ['3'] : d.category==='mini-trucks' ? ['4','6'] : HOURS_CATS.includes(d.category) ? ['0'] : ['6','10','12','14','16','18','22'];
        if (!opts.includes(String(d.tyres))) d.tyres = opts[0];
        return field(f, `<select class="input" id="s_tyres" data-fk="tyres">${opts.map(o=>`<option value="${o}" ${String(d.tyres)===o?'selected':''}>${o==='0'?'Not applicable':o}</option>`).join('')}</select>`);
      }
      case 'state': return field(f, `<select class="input" id="s_state" data-fk="state">${options(STATES, d.state, 'Select state')}</select>`);
      case 'toggle': {
        const on = f.builtin ? !!d[f.key] : !!d.extras[f.key];
        return `<div class="field"><label>&nbsp;</label><button type="button" class="set-row card" data-tg="${f.key}" style="height:50px;padding:0 14px"><span class="grow" style="font-weight:600">${esc(f.label)}</span><span class="toggle ${on?'on':''}"></span></button></div>`;
      }
      case 'checks': return `<div class="field" style="grid-column:1/-1"><label>${esc(f.label)}${f.required?REQ:''}</label><div class="checks">${f.options.map(h=>`<label><input type="checkbox" data-hl="${esc(h)}" ${d.highlights.includes(h)?'checked':''}> ${esc(h)}</label>`).join('')}</div><div class="err-msg" data-err="${f.key}" hidden></div></div>`;
      case 'photos': return `<div style="grid-column:1/-1"><p class="muted" style="margin:0 0 12px;font-size:14px">${esc(f.label)}${f.required?REQ:''} — add up to 8 clear photos: front, side, rear, cabin and tyres. The first photo is the cover.</p>
        <div class="photos">${d.photos.map((p,i)=>`<div class="ph"><img src="${p}" alt="Photo ${i+1}"><button type="button" data-rmph="${i}" aria-label="Remove photo">${I('x','xs')}</button>${i===0?'<span class="cover">Cover</span>':`<button type="button" data-cover="${i}" style="left:6px;right:auto;top:auto;bottom:6px;width:auto;padding:0 8px;border-radius:6px;font-size:11px;font-weight:700;height:22px">Make cover</button>`}</div>`).join('')}
        ${d.photos.length<8?`<label class="add">${I('camera','lg')}Add photos<input type="file" accept="image/*" multiple hidden data-photos></label>`:''}</div>
        <div data-uploading class="muted" style="font-size:13px;margin-top:8px" hidden>Processing photos…</div><div class="err-msg" data-err="photos" hidden></div></div>`;
      case 'color': return d.photos.length ? '' : `<div class="card" style="padding:16px;grid-column:1/-1"><b style="display:block;margin-bottom:4px">No photos yet?</b><p class="muted" style="margin:0 0 12px;font-size:14px">We'll show an illustration of your vehicle until you add photos. Pick the closest body colour.</p>
        <div class="swatches">${SWATCHES.map(c=>`<button type="button" data-color="${c}" class="${d.color===c?'on':''}" style="background:${c}" aria-label="Colour ${c}"></button>`).join('')}</div>
        <div class="preview-wrap" style="margin-top:14px">${VA.scene(VA.draw(d.category, d.subtype, d.color, +d.tyres||6))}</div></div>`;
    }
    return '';
  }

  function validate(){
    const err = (k, m) => { throw new ApiError(m, k); };
    for (const f of fieldsOn()){
      const v = getV(f);
      const empty = f.type==='checks' ? !d.highlights.length : f.type==='photos' ? !d.photos.length : f.type==='tyres' ? (!+d.tyres && !isHours()) : (v===''||v==null);
      if (f.required && f.type!=='toggle' && f.type!=='color' && empty) err(f.key, `${labelOf(f)} is required`);
    }
    const y = new Date().getFullYear();
    if (!(+d.year>=1990 && +d.year<=y)) err('year', `Enter a year between 1990 and ${y}`);
    if (d.km==='' || +d.km<0) err('km', isHours() ? 'Enter hours used' : 'Enter KM driven');
    if (!(+d.price>=10000)) err('price', 'Enter a price of at least ₹10,000');
    if (d.regNo && fieldByKey('regNo')?.enabled && !/^[A-Z]{2}\s?\d{1,2}\s?[A-Z]{0,3}\s?\d{1,4}$/i.test(d.regNo.trim())) err('regNo', 'Use the format TS 07 UF 1234');
  }

  return { nav:'sell', html: `${topbar({back: editing?'#/v/'+editing.id:'#/', title: editing?'Edit listing':'Sell your vehicle', sub: editing?editing.id:'Reach thousands of verified buyers'})}
  <div class="wrap page" style="max-width:820px"><div data-step></div><div data-foot></div></div>`,
  mount(root){
    const box = $('[data-step]',root), foot = $('[data-foot]',root);
    const draw = () => {
      if (step === 1){
        box.innerHTML = `<h2 style="margin:0 0 12px;font-size:20px">What are you selling?</h2><div class="pick-grid">${CATS.map(c=>`<button class="pick ${d.category===c.id?'on':''}" data-cat="${c.id}">${catArt(c.id, c.id==='trucks'?'lorries':null, c.id==='trucks'?'#1D4ED8':c.color)}${esc(c.name)}</button>`).join('')}</div>`;
        foot.innerHTML = '';
        $$('[data-cat]',box).forEach(b => b.onclick = () => { if (d.category !== b.dataset.cat){ d.category = b.dataset.cat; d.subtype = ''; d.brand = ''; d.tyres = ''; } saveDraft(); step = 2; draw(); scrollTo(0,0); });
        return;
      }
      const cat = catById(d.category);
      const sections = FORM_GROUPS.map(g => { const html = fieldsOn().filter(f=>f.group===g).map(fieldHtml).join(''); return html.trim() ? `<div class="card panel" style="margin-bottom:14px"><h2 style="margin:0 0 12px;font-size:18px">${FORM_TITLES[g]}</h2><div class="grid2">${html}</div></div>` : ''; }).join('');
      box.innerHTML = `<div class="card panel" style="margin-bottom:14px;display:flex;align-items:center;gap:14px;padding:12px 16px"><div style="width:84px;flex:none">${catArt(cat.id, cat.id==='trucks'?(d.subtype||'lorries'):null, cat.id==='trucks'?'#1D4ED8':cat.color)}</div><div class="grow"><small class="muted">Selling</small><div><b style="font-size:17px">${esc(cat.name)}</b></div></div>${editing?'':'<button type="button" class="link" data-change>Change</button>'}</div>${sections}`;
      foot.innerHTML = `<div style="display:flex;gap:10px;margin-top:6px"><button class="btn btn-ghost" data-prev style="flex:1">Back</button><button class="btn btn-primary" data-next style="flex:2">${editing?`${I('check')} Save changes`:`${I('check')} Publish listing`}</button></div>`;
      bind();
    };
    const bind = () => {
      $$('[data-fk]',box).forEach(i => {
        const f = fieldByKey(i.dataset.fk);
        i.addEventListener(i.tagName==='SELECT' ? 'change' : 'input', () => {
          setV(f, i.value); const e = $(`[data-err="${f.key}"]`,box); if (e) e.hidden = true; i.classList.remove('err');
          if (f.key==='price'){ const h=$('[data-pricehint]',box); if(h) h.textContent = +i.value ? `Shown as ${inr(+i.value)} (${inrShort(+i.value)})` : ''; }
          saveDraft();
          if (f.key==='subtype'){ d.brand = ''; d.tyres = ''; draw(); }
          if (f.key==='brand') draw();
        });
      });
      $$('[data-tg]',box).forEach(b => b.onclick = () => { const f = fieldByKey(b.dataset.tg); const on = !getV(f); setV(f, on); $('.toggle',b).classList.toggle('on', on); saveDraft(); });
      $$('[data-hl]',box).forEach(c => c.onchange = () => { const s = new Set(d.highlights); c.checked ? s.add(c.dataset.hl) : s.delete(c.dataset.hl); d.highlights = [...s]; saveDraft(); });
      $$('[data-color]',box).forEach(b => b.onclick = () => { d.color = b.dataset.color; saveDraft(); draw(); });
      $$('[data-rmph]',box).forEach(b => b.onclick = () => { d.photos.splice(+b.dataset.rmph,1); draw(); });
      $$('[data-cover]',box).forEach(b => b.onclick = () => { const [p] = d.photos.splice(+b.dataset.cover,1); d.photos.unshift(p); draw(); });
      const ph = $('[data-photos]',box); if (ph) ph.onchange = async e => { $('[data-uploading]',box).hidden = false;
        for (const f of [...e.target.files].slice(0, 8-d.photos.length)) { try { d.photos.push(await compressImage(f, 1000, .7)); } catch(er){ toast(er.message,'bad'); } } draw(); };
      const ch = $('[data-change]',box); if (ch) ch.onclick = () => { step = 1; draw(); scrollTo(0,0); };
    };
    const showErr = e => { const el = $(`[data-err="${e.field}"]`,box); if (el){ el.textContent = e.message; el.hidden = false; el.scrollIntoView({block:'center', behavior:'smooth'}); } const i = $(`[data-fk="${e.field}"]`,box); if (i){ i.classList.add('err'); i.focus({preventScroll:true}); } if (!el) toast(e.message,'bad'); };
    foot.onclick = async e => {
      if (e.target.closest('[data-prev]')){ if (editing) go('#/v/'+editing.id); else { step = 1; draw(); scrollTo(0,0); } return; }
      const btn = e.target.closest('[data-next]'); if (!btn) return;
      try { validate(); } catch(er){ return showErr(er); }
      btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Saving…';
      try {
        const l = editing ? await API.listings.update(editing.id, d) : await API.listings.create(d);
        if (!editing) try { localStorage.removeItem(DKEY); } catch(er){}
        toast(editing ? 'Changes saved' : 'Listing published'); App.refreshBadges(); go('#/v/'+l.id);
      } catch(er){ draw(); if (er.field) showErr(er); else toast(er.message,'bad'); }
    };
    draw();
  }};
};

      <button class="set-row" data-logout><span class="s-ic">${I('logout')}</span><span class="grow"><b>Log out</b></span>${I('right','sm')}</button></div>`;

      <div class="stats"><div class="stat"><b>${mine.filter(l=>l.status==='active').length}</b><small>Active</small></div><div class="stat"><b>${mine.reduce((s,l)=>s+(l.views||0),0)}</b><small>Total views</small></div><a href="#/messages" class="stat"><b>${API.chats.mine().length}</b><small>Chats${unreadMsgs?` · ${unreadMsgs} new`:''}</small></a></div></div>

        (el,close)=>{ const f=$('[data-pwf]',el); f.onsubmit=async e=>{ e.preventDefault(); $$('[data-err]',f).forEach(x=>x.hidden=true); try{ await API.auth.changePassword(f.old.value, f.new.value); close(); toast('Password updated'); } catch(er){ const m=$(`[data-err="${er.field}"]`,f); if(m){m.textContent=er.message;m.hidden=false;} } }; });
      $('[data-export]',root).onclick=()=>{ const me2=API.meId(); const data={profile:API.auth.me(), listings:API.listings.querySync({sellerId:me2,status:'any'}).map(l=>({...l,photos:l.photos.length+' photos'})), favorites:API.favs.ids(), chats:API.chats.mine().map(c=>({...c, messages:API.chats.messages(c.id).map(m=>({from:m.senderId===me2?'me':'them', text:m.text, at:new Date(m.createdAt).toISOString()}))})), financeRequests:API.finance.mine()};
        const json = JSON.stringify(data,null,2);

      $('[data-logout]',root).onclick=async()=>{ await API.auth.logout(); toast('Logged out'); go('#/'); };
    }
  }};

Views.auth = (_, q, mode='login', role='user') => {
  const isOwner = role==='owner';
  const next = q.get('next') || (isOwner ? '#/owner' : '#/');
  const authScene = `<svg class="scene" viewBox="0 0 600 300" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><rect y="230" width="600" height="70" fill="#1B2A55"/><rect y="228" width="600" height="3" fill="#2E4382"/>
    <g fill="#ECEFF3" opacity=".5">${[20,120,220,320,420,520].map(x=>`<rect x="${x}" y="270" width="50" height="4" rx="2"/>`).join('')}</g>
    <g transform="translate(-10 120) scale(1.05)">${VA.draw('trucks','tippers','#E9B21C',10)}</g><g transform="translate(250 112) scale(1.15)">${VA.draw('trucks','lorries','#E5194D',10)}</g></svg>`;
  return { bare:true, html: `<div class="auth">
    <div class="auth-art"><a href="#/" class="brand-mark" style="position:relative"><span class="logo">${I('truck','sm')}</span>Spidy</a>
      <h2>${isOwner?'Run the marketplace.':mode==='login'?'Welcome back to the yard.':'Buy and sell commercial vehicles with confidence.'}</h2><p>${isOwner?'Review listings, manage members and follow up on finance requests from the owner console.':'Trucks, tippers, tractors, buses and machines from verified sellers across India — with private chat and finance help built in.'}</p>${authScene}</div>
    <div class="auth-card">
      <a href="#/" class="link" style="color:var(--ink-2)">${I('back','xs')} Continue browsing</a>
      <h1>${isOwner?'Owner sign in':mode==='login'?'Log in':'Create your account'}</h1><p class="muted" style="margin:0">${isOwner?'Restricted to the marketplace owner.':mode==='login'?'Chat with sellers, save vehicles and request finance.':'It takes less than a minute.'}</p>
      <div class="role-switch" aria-label="Account type"><a href="#/login" class="${isOwner?'':'on'}">${I('user','sm')} User</a><a href="#/owner/login" class="${isOwner?'on':''}">${I('shieldCheck','sm')} Owner</a></div>
      ${isOwner?'':`<div class="tabs" role="tablist"><button class="${mode==='login'?'on':''}" data-mode="login" role="tab">Log in</button><button class="${mode==='signup'?'on':''}" data-mode="signup" role="tab">Sign up</button></div>`}
      <form data-auth novalidate>
        ${mode==='signup'&&!isOwner?`<div class="field"><label for="a_name">Full name</label><input class="input" id="a_name" name="name" autocomplete="name" placeholder="e.g. Ravi Kumar"><div class="err-msg" data-err="name" hidden></div></div>
          <div class="field"><label for="a_email">Email</label><input class="input" id="a_email" name="email" type="email" autocomplete="email" placeholder="you@example.com"><div class="err-msg" data-err="email" hidden></div></div>
          <div class="field"><label for="a_phone">Mobile number</label><input class="input" id="a_phone" name="phone" inputmode="numeric" maxlength="10" autocomplete="tel" placeholder="10 digit mobile number"><div class="err-msg" data-err="phone" hidden></div></div>
          <div class="grid2"><div class="field"><label for="a_city">City</label><input class="input" id="a_city" name="city" placeholder="Optional"></div><div class="field"><label for="a_state">State</label><select class="input" id="a_state" name="state"><option value="">Optional</option>${STATES.map(s=>`<option>${s}</option>`).join('')}</select></div></div>`
        :`<div class="field"><label for="a_id">${isOwner?'Owner email':'Email or mobile number'}</label><input class="input" id="a_id" name="id" autocomplete="username" placeholder="${isOwner?'owner@example.com':'you@example.com or 98XXXXXXXX'}"><div class="err-msg" data-err="id" hidden></div></div>`}
        <div class="field"><label for="a_pw">Password</label><div class="pw-wrap"><input class="input" id="a_pw" name="password" type="password" autocomplete="${mode==='login'?'current-password':'new-password'}" placeholder="${mode==='login'?'Your password':'At least 8 characters'}"><button type="button" data-eye aria-label="Show password">${I('eye','sm')}</button></div><div class="err-msg" data-err="password" hidden></div></div>
        <button class="btn btn-primary btn-block" data-submit>${isOwner?'Sign in as owner':mode==='login'?'Log in':'Create account'}</button>
      </form>
      ${isOwner ? `<p class="muted" style="font-size:13px;text-align:center;margin-top:14px">Owner accounts are created by the site administrator.</p>`
        : Store.demo ? `<div class="or">or</div>
      <button class="btn btn-outline btn-block" data-demo>${I('user','sm')} Try the demo account</button>
      <p class="muted" style="font-size:13px;text-align:center;margin-top:10px">Demo: demo@spidy.in · demo1234</p>` : ''}
    </div></div>`,
  mount(root){
    $$('[data-mode]',root).forEach(b=>b.onclick=()=>go(`#/${b.dataset.mode}${next!=='#/'?'?next='+encodeURIComponent(next):''}`));
    const pw=$('#a_pw',root); $('[data-eye]',root).onclick=e=>{ const show=pw.type==='password'; pw.type=show?'text':'password'; e.currentTarget.innerHTML=I(show?'eyeOff':'eye','sm'); };
    const ph=$('#a_phone',root); if(ph) ph.addEventListener('input',()=>ph.value=ph.value.replace(/\D/g,''));
    const form=$('[data-auth]',root);
    $$('input',form).forEach(i=>i.addEventListener('input',()=>{ i.classList.remove('err'); const e=$(`[data-err="${i.name}"]`,form); if(e) e.hidden=true; }));
    const done = u => { toast(`Welcome, ${u.name.split(' ')[0]}`); App.refreshBadges(); go(u.role==='owner' ? '#/owner' : next.startsWith('#/login')||next.startsWith('#/signup') ? '#/' : next); };
    form.onsubmit = async e => {
      e.preventDefault(); const btn=$('[data-submit]',form); const label=btn.textContent; btn.disabled=true; btn.innerHTML='<span class="spin"></span>';
      try { const data=Object.fromEntries(new FormData(form)); done(mode==='login' ? await API.auth.login({...data, as: role}) : await API.auth.register(data)); }
      catch(er){ btn.disabled=false; btn.textContent=label; const el=$(`[data-err="${er.field}"]`,form); if(el){ el.textContent=er.message; el.hidden=false; form[er.field]?.classList.add('err'); form[er.field]?.focus(); } else toast(er.message,'bad'); }
    };

    $(mode==='login'||isOwner?'#a_id':'#a_name',root).focus();
  }};
};
/* ---- owner console ---- */
Views.owner = ({tab='overview'}) => {
  const TABS = [['overview','Overview'],['users','Users'],['listings','Listings'],['finance','Finance requests'],['form','Sell form']];
  const me = API.auth.me();
  return { nav:'owner', html: `${topbar({title:'Owner dashboard', sub:`Signed in as ${me.email}`, right:`<button class="btn btn-ghost btn-sm" data-ologout>${I('logout','xs')} Log out</button>`})}
    <div class="wrap page"><div class="ptabs">${TABS.map(([k,n])=>`<a class="chip ${tab===k?'on':''}" href="#/owner/${k}">${n}</a>`).join('')}</div>
    <div data-obody><p class="muted" style="text-align:center;padding:40px 0">Loading…</p></div></div>`,
  mount(root){
    $('[data-ologout]',root).onclick = async () => { await API.auth.logout(); toast('Logged out'); go('#/owner/login'); };
    const body = $('[data-obody]',root);
    const fail = e => { body.innerHTML = emptyState('info','Could not load this page', e.message, `<button class="btn btn-primary" data-retry>Try again</button>`); $('[data-retry]',body).onclick = () => App.render(); };
    const act = async (fn, msg) => { try { await fn(); toast(msg); return true; } catch(e){ toast(e.message,'bad'); return false; } };
    const toolbar = (ph, extra='') => `<div class="otools"><input class="input" type="search" data-q placeholder="${ph}" aria-label="${ph}">${extra}</div>`;
    const debounce = (fn, ms=250) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

    if (tab === 'overview') API.owner.overview().then(o => {
      body.innerHTML = `<div class="ogrid">${[
        ['Users', o.users, `+${o.newUsers7d} this week${o.suspended?` · ${o.suspended} suspended`:''}`],
        ['Active listings', o.listingsActive, `${o.listingsSold} sold · ${o.listingsRemoved} removed`],
        ['New finance requests', o.financeNew, `${o.financeTotal} total`],
        ['Conversations', o.chats, `${o.messages} messages`],
        ['Inventory value', inrShort(o.inventoryValue), 'across active listings'],
      ].map(([k,v,s])=>`<div class="card ostat"><small>${k}</small><b>${v}</b><span>${s}</span></div>`).join('')}</div>
      <div class="ocols">
        <div class="card panel"><h3>Newest users</h3>${o.recentUsers.map(u=>`<div class="orow">${avatar(u)}<div class="grow"><b>${esc(u.name)}</b><small>${esc(u.email)} · ${ago(u.createdAt)}</small></div></div>`).join('') || '<p class="muted" style="margin:0">No users yet.</p>'}</div>
        <div class="card panel"><h3>Newest listings</h3>${o.recentListings.map(l=>`<a class="orow" href="#/v/${esc(l.id)}"><div class="grow"><b>${esc(l.title)}</b><small>${esc(l.seller)} · ${inr(l.price)} · ${ago(l.createdAt)}</small></div><span class="status ${l.status}">${l.status}</span></a>`).join('') || '<p class="muted" style="margin:0">No listings yet.</p>'}</div>
      </div>`;
    }).catch(fail);

    if (tab === 'users'){
      body.innerHTML = toolbar('Search by name, email or mobile') + '<div data-list></div>';
      const list = $('[data-list]',body); let rows = [];
      const draw = () => { list.innerHTML = rows.length ? rows.map(u => `<div class="card my-row" data-uid="${esc(u.id)}">${avatar(u)}<div class="mid">
        <h4>${esc(u.name)} ${u.verified?`<span class="verified">${I('shieldCheck','xs')}</span>`:''} <span class="status ${u.status==='suspended'?'removed':'active'}">${u.status==='suspended'?'Suspended':'Active'}</span></h4>
        <div class="muted" style="font-size:13px">${esc(u.email)} · ${esc(u.phone)} · ${esc([u.city,u.state].filter(Boolean).join(', ') || 'No location')}</div>
        <div class="muted" style="font-size:12.5px">${u.listingCount} listing${u.listingCount===1?'':'s'} · joined ${monthYear(u.createdAt)}${u.lastLogin?` · last login ${ago(u.lastLogin)}`:' · never signed in'}</div></div>
        <div class="acts"><button class="btn btn-ghost btn-sm" data-a="verify">${u.verified?'Remove badge':'Verify'}</button><button class="btn btn-ghost btn-sm" data-a="suspend">${u.status==='suspended'?'Reactivate':'Suspend'}</button><button class="btn btn-ghost btn-sm" data-a="delete" aria-label="Delete user">${I('trash','xs')}</button></div></div>`).join('')
        : emptyState('user','No users found','Try a different search.'); };
      const load = () => API.owner.users($('[data-q]',body).value.trim()).then(r => { rows = r; draw(); }).catch(fail);
      $('[data-q]',body).oninput = debounce(load); load();
      list.onclick = async e => {
        const b = e.target.closest('[data-a]'); if (!b) return; const u = rows.find(x => x.id === b.closest('[data-uid]').dataset.uid); if (!u) return;
        if (b.dataset.a === 'verify' && await act(() => API.owner.patchUser(u.id, {verified:!u.verified}), u.verified ? 'Badge removed' : 'User verified')) load();
        if (b.dataset.a === 'suspend'){
          const suspending = u.status !== 'suspended';
          if (suspending && !await confirmSheet({title:`Suspend ${u.name}?`, body:'They will be signed out and unable to log in. Their listings are hidden from buyers.', ok:'Suspend'})) return;
          if (await act(() => API.owner.patchUser(u.id, {status: suspending ? 'suspended' : 'active'}), suspending ? 'User suspended' : 'User reactivated')) load();
        }
        if (b.dataset.a === 'delete' && await confirmSheet({title:`Delete ${u.name}?`, body:'This permanently deletes the account, their listings, chats and requests. It cannot be undone.', ok:'Delete'})
          && await act(() => API.owner.deleteUser(u.id), 'User deleted')) load();
      };
    }

    if (tab === 'listings'){
      let status = '';
      body.innerHTML = toolbar('Search by title, ID, seller or city') + `<div class="ptabs" style="margin-top:0">${[['','All'],['active','Active'],['sold','Sold'],['removed','Removed']].map(([k,n])=>`<button class="chip ${k===''?'on':''}" data-st="${k}">${n}</button>`).join('')}</div><div data-list></div>`;
      const list = $('[data-list]',body); let rows = [];
      const draw = () => { list.innerHTML = rows.length ? rows.map(l => `<div class="card my-row" data-lid="${esc(l.id)}"><div class="mid">
        <h4><a href="#/v/${esc(l.id)}">${esc(l.title)}</a> <span class="status ${l.status}">${l.status}</span></h4>
        <div class="price" style="font-size:15px">${inr(l.price)}</div>
        <div class="muted" style="font-size:12.5px">${esc(l.id)} · ${esc(l.sellerName)} · ${esc(l.city)}, ${esc(l.state)} · ${l.views} views · ${ago(l.createdAt)}</div></div>
        <div class="acts"><button class="btn btn-ghost btn-sm" data-a="toggle">${l.status==='removed'?'Restore':'Remove'}</button><button class="btn btn-ghost btn-sm" data-a="delete" aria-label="Delete listing">${I('trash','xs')}</button></div></div>`).join('')
        : emptyState('tag','No listings found','Try a different search or filter.'); };
      const load = () => API.owner.listings($('[data-q]',body).value.trim(), status).then(r => { rows = r; draw(); }).catch(fail);
      $('[data-q]',body).oninput = debounce(load); load();
      $$('[data-st]',body).forEach(c => c.onclick = () => { status = c.dataset.st; $$('[data-st]',body).forEach(x => x.classList.toggle('on', x === c)); load(); });
      list.onclick = async e => {
        const b = e.target.closest('[data-a]'); if (!b) return; const l = rows.find(x => x.id === b.closest('[data-lid]').dataset.lid); if (!l) return;
        if (b.dataset.a === 'toggle'){
          const removing = l.status !== 'removed';
          if (removing && !await confirmSheet({title:'Remove this listing?', body:'It is hidden from buyers and the seller is notified. You can restore it later.', ok:'Remove'})) return;
          if (await act(() => API.owner.patchListing(l.id, removing ? 'removed' : 'active'), removing ? 'Listing removed' : 'Listing restored')) { Sync.pull().catch(()=>{}); load(); }
        }
        if (b.dataset.a === 'delete' && await confirmSheet({title:'Delete this listing forever?', body:'Chats and saved entries for it are deleted too. This cannot be undone.', ok:'Delete'})
          && await act(() => API.owner.deleteListing(l.id), 'Listing deleted')) { Sync.pull().catch(()=>{}); load(); }
      };
    }

    if (tab === 'finance') API.owner.finance().then(rows => {
      const label = {new:'New', contacted:'Contacted', closed:'Closed'};
      body.innerHTML = rows.length ? rows.map(r => `<div class="card my-row" data-fid="${esc(r.id)}"><div class="mid"><h4>${esc(r.listingTitle)}</h4>
        <div class="muted" style="font-size:13px">${esc(r.name)} (age ${r.age}) · <a class="link" href="tel:${esc(r.mobile)}">${esc(r.mobile)}</a> · ${esc(r.city)}, ${esc(r.state)} ${esc(r.pincode)}</div>
        <div class="muted" style="font-size:12.5px">${esc(r.userEmail)} · submitted ${ago(r.createdAt)}</div></div>
        <div class="acts"><select class="input" data-fs aria-label="Request status" style="height:38px;width:auto">${Object.entries(label).map(([k,n])=>`<option value="${k}" ${r.status===k?'selected':''}>${n}</option>`).join('')}</select></div></div>`).join('')
        : emptyState('bank','No finance requests yet','Requests from buyers appear here.');
      $$('[data-fs]',body).forEach(s => s.onchange = async () => { await act(() => API.owner.patchFinance(s.closest('[data-fid]').dataset.fid, s.value), 'Status updated'); });
    }).catch(fail);

    if (tab === 'form'){
      const TYPE_LABEL = {subtype:'Dropdown (truck types)', brand:'Dropdown (brands)', text:'Short text', number:'Number', select:'Dropdown', textarea:'Long text', tyres:'Dropdown (tyres)', state:'Dropdown (states)', toggle:'Yes / No', checks:'Checklist', photos:'Photo upload', color:'Colour picker'};
      const GROUP_LABEL = {vehicle:'Vehicle', details:'Details', media:'Photos', pricing:'Price & location'};
      const REQUIRABLE = ['text','number','select','textarea','tyres','photos','checks'];
      let fields = [];
      const draw = () => {
        body.innerHTML = `<div class="card panel" style="margin-bottom:6px;display:flex;gap:12px;align-items:center;flex-wrap:wrap"><div class="grow" style="min-width:220px"><b>Sell form</b><div class="muted" style="font-size:13px">Choose what sellers fill in on the “Sell your vehicle” page. Changes apply immediately. Fields marked “Always on” are needed for every listing.</div></div><button class="btn btn-primary btn-sm" data-add>${I('plus','xs')} Add field</button></div>`
        + ['vehicle','details','media','pricing'].map(g => { const rows = fields.filter(f => f.group===g);
          return rows.length ? `<h3 style="margin:18px 0 8px;font-size:15px">${GROUP_LABEL[g]}</h3>` + rows.map((f,i) => `<div class="card my-row" data-fk="${esc(f.key)}" style="${f.enabled?'':'opacity:.65'}"><div class="mid">
            <h4>${esc(f.label)} ${f.locked?`<span class="status closed">Always on</span>`:''}${f.builtin?'':' <span class="status contacted">Custom</span>'}${f.enabled?'':' <span class="status removed">Hidden</span>'}</h4>
            <div class="muted" style="font-size:12.5px">${esc(TYPE_LABEL[f.type]||f.type)}${f.options.length?` · ${f.options.length} options`:''}</div></div>
            <div class="acts" style="align-items:center">
              <label class="chk"><input type="checkbox" data-t="enabled" ${f.enabled?'checked':''} ${f.locked?'disabled':''}> Shown</label>
              ${REQUIRABLE.includes(f.type)?`<label class="chk"><input type="checkbox" data-t="required" ${f.required?'checked':''} ${f.locked||!f.enabled?'disabled':''}> Required</label>`:''}
              <button class="btn btn-ghost btn-sm" data-a="up" ${i===0?'disabled':''} aria-label="Move up">↑</button><button class="btn btn-ghost btn-sm" data-a="down" ${i===rows.length-1?'disabled':''} aria-label="Move down">↓</button>
              <button class="btn btn-ghost btn-sm" data-a="edit">${I('edit','xs')} Edit</button>${f.builtin?'':`<button class="btn btn-ghost btn-sm" data-a="delete" aria-label="Delete field">${I('trash','xs')}</button>`}
            </div></div>`).join('') : ''; }).join('');
      };
      const load = () => API.owner.formFields().then(r => { fields = r; draw(); }).catch(fail);
      const apply = (p, msg) => p.then(r => { fields = r; draw(); if (msg) toast(msg); }).catch(e => { toast(e.message,'bad'); load(); });
      load();
      const optsInput = (v='') => `<div class="field" data-opts><label for="ff_opts">Options <span class="muted">(one per line)</span></label><textarea class="input" id="ff_opts" name="options" rows="5">${esc(v)}</textarea><div class="err-msg" data-err="options" hidden></div></div>`;
      const showErr = (f, er) => { const el = $(`[data-err="${er.field}"]`,f); if (el){ el.textContent = er.message; el.hidden = false; } else toast(er.message,'bad'); };
      const lines = s => s.split('\n').map(x => x.trim()).filter(Boolean);
      body.onclick = async e => {
        if (e.target.closest('[data-add]')){
          return openSheet(`<h3>Add a field</h3><form data-ff novalidate>
            <div class="field"><label for="ff_label">Field name</label><input class="input" id="ff_label" name="label" placeholder="e.g. Permit valid until"><div class="err-msg" data-err="label" hidden></div></div>
            <div class="field"><label for="ff_type">Field type</label><select class="input" id="ff_type" name="type">${[['text','Short text'],['number','Number'],['select','Dropdown'],['textarea','Long text'],['toggle','Yes / No']].map(([k,n])=>`<option value="${k}">${n}</option>`).join('')}</select></div>
            <div class="field"><label for="ff_group">Show in section</label><select class="input" id="ff_group" name="group"><option value="details">Details</option><option value="pricing">Price & location</option></select></div>
            <div data-optwrap hidden>${optsInput()}</div>
            <label class="chk" style="display:flex;gap:8px;margin:6px 0 14px"><input type="checkbox" name="required"> Required</label>
            <button class="btn btn-primary btn-block">Add field</button></form>`, (el, close) => {
            const f = $('[data-ff]',el), tsel = f.type; const sync = () => { $('[data-optwrap]',el).hidden = tsel.value !== 'select'; };
            tsel.onchange = sync;
            f.onsubmit = ev => { ev.preventDefault(); $$('[data-err]',f).forEach(x=>x.hidden=true);
              API.owner.addField({label:f.label.value, type:tsel.value, group:f.group.value, required:f.required.checked, options:lines(f.options.value)}).then(r => { fields = r; draw(); close(); toast('Field added'); }).catch(er => showErr(f, er)); };
          });
        }
        const row = e.target.closest('[data-fk]'); if (!row) return; const key = row.dataset.fk; const fld = fields.find(x => x.key===key);
        const a = e.target.closest('[data-a]')?.dataset.a;
        if (a==='up' || a==='down') return apply(API.owner.moveField(key, a==='up' ? -1 : 1));
        if (a==='delete'){ if (await confirmSheet({title:`Delete “${fld.label}”?`, body:'It is removed from the Sell form. Values sellers already entered stay saved but are no longer shown on listings.', ok:'Delete'})) apply(API.owner.deleteField(key), 'Field deleted'); return; }
        if (a==='edit'){
          const hasOpts = ['select','checks'].includes(fld.type), hasPh = ['text','number','textarea'].includes(fld.type);
          openSheet(`<h3>Edit “${esc(fld.label)}”</h3><form data-ff novalidate>
            <div class="field"><label for="ff_label">Field name</label><input class="input" id="ff_label" name="label" value="${esc(fld.label)}"><div class="err-msg" data-err="label" hidden></div></div>
            ${hasPh?`<div class="field"><label for="ff_ph">Hint text <span class="muted">(shown inside the empty box)</span></label><input class="input" id="ff_ph" name="placeholder" value="${esc(fld.placeholder)}"></div>`:''}
            ${hasOpts?optsInput(fld.options.join('\n')):''}
            ${!fld.builtin?`<div class="field"><label for="ff_group">Show in section</label><select class="input" id="ff_group" name="group"><option value="details" ${fld.group==='details'?'selected':''}>Details</option><option value="pricing" ${fld.group==='pricing'?'selected':''}>Price & location</option></select></div>`:''}
            <button class="btn btn-primary btn-block">Save</button></form>`, (el, close) => {
            const f = $('[data-ff]',el);
            f.onsubmit = ev => { ev.preventDefault(); $$('[data-err]',f).forEach(x=>x.hidden=true);
              const p = {label:f.label.value}; if (f.placeholder) p.placeholder = f.placeholder.value; if (f.options) p.options = lines(f.options.value); if (f.group) p.group = f.group.value;
              API.owner.patchField(key, p).then(r => { fields = r; draw(); close(); toast('Field updated'); }).catch(er => showErr(f, er)); };
          });
        }
      };
      body.onchange = e => { const t = e.target.closest('[data-t]'); if (!t) return; const key = t.closest('[data-fk]').dataset.fk; apply(API.owner.patchField(key, {[t.dataset.t]: t.checked}), t.dataset.t==='enabled' ? (t.checked ? 'Field shown' : 'Field hidden') : 'Saved'); };
    }
  }};
};
Views.notFound = (msg='The page you are looking for does not exist.') => ({ nav:'home', html: `${topbar({back:'#/', title:'Not found'})}<div class="wrap page">${emptyState('search','Nothing here', msg, `<a href="#/" class="btn btn-primary">Go to home</a>`)}</div>`});

/* ------------------------------- APP -------------------------------- */
const ROUTES = [
  ['', 'home'], ['buy','buy'], ['c/:cat','category'], ['c/trucks/:sub', 'brandsTruck'], ['list/:cat/:sub','listing'],
  ['v/:id','details'], ['seller/:id','seller'], ['chat/:id','chat', true], ['messages','messages', true],
  ['finance/:id','finance'], ['finance-done/:id','financeDone', true], ['sell','sell', true], ['sell/:id','sell', true],
  ['profile','profile', true], ['profile/:tab','profile', true], ['favorites','favorites', true], ['notifications','notifications', true],
  ['search','search'], ['login','login'], ['signup','signup'], ['owner/login','ownerLogin'],
  ['owner','owner','owner'], ['owner/:tab','owner','owner'],
];
const App = {
  cleanup: [], viewed: new Set(), chatDraw: null, started: false,
  match(path){
    const segs = path.split('/').filter(Boolean);
    for (const [pat, name, auth] of ROUTES){
      const ps = pat.split('/').filter(Boolean); if (ps.length !== segs.length) continue;
      const params = {}; let ok = true;
      ps.forEach((p,i)=>{ if (p.startsWith(':')) params[p.slice(1)] = decodeURIComponent(segs[i]); else if (p!==segs[i]) ok=false; });
      if (ok) return {name, params, auth};
    }
    return {name:'notFound', params:{}};
  },
  render(){
    this.cleanup.forEach(f=>{ try{f();}catch(e){} }); this.cleanup = [];
    $('#layer').innerHTML = '';
    const raw = location.hash.replace(/^#\/?/, ''); const [path, qs=''] = raw.split('?'); const q = new URLSearchParams(qs);
    const r = this.match(path);
    if (r.auth === 'owner' && !API.auth.isOwner()){ location.replace('#/owner/login'); return; }
    if (r.auth === true && API.auth.isOwner()){ location.replace('#/owner'); return; }
    if (r.auth === true && !API.meId()){ location.replace('#/login?next=' + encodeURIComponent(location.hash || '#/')); return; }
    if ((r.name==='login'||r.name==='signup'||r.name==='ownerLogin') && API.meId()){ location.replace(API.auth.isOwner() ? '#/owner' : (q.get('next')||'#/')); return; }
    let v;
    try {
      switch(r.name){
        case 'brandsTruck': v = Views.brands({cat:'trucks', sub:r.params.sub}); break;
        case 'login': v = Views.auth(r.params, q, 'login'); break;
        case 'signup': v = Views.auth(r.params, q, 'signup'); break;
        case 'ownerLogin': v = Views.auth(r.params, q, 'login', 'owner'); break;
        case 'notFound': v = Views.notFound(); break;
        default: v = Views[r.name](r.params, q);
      }
    } catch(e){ console.error(e); v = Views.notFound('Something went wrong loading this page. Try again.'); }
    const nav = v.nav || 'home';
    const desk = {home:'home', search:'search', sell:'sell', messages:'messages', profile:'', buy:'buy'}[r.name==='buy'?'buy':nav];
    $('#app').innerHTML = v.bare ? v.html : globalBar(desk) + v.html + bottomNav(nav);
    $('#app').classList.toggle('is-chat', !!v.chat);
    if (!v.chat) window.scrollTo(0, 0);
    const root = $('#app'); v.mount && v.mount(root);
    this.refreshBadges();
    const t = $('.topbar h1', root)?.textContent || $('.auth-card h1', root)?.textContent;
    document.title = (r.name==='home' ? 'Spidy · Commercial Vehicle Marketplace' : (t ? t + ' · Spidy' : 'Spidy'));
  },
  refreshBadges(){
    const n = API.notify.unread(), m = API.chats.unreadTotal();
    $$('[data-badge="bell"]').forEach(el=>{ el.className = n ? 'badge' : ''; el.textContent = n ? (n>9?'9+':n) : ''; });
    $$('[data-badge="msgdot"]').forEach(el=>{ el.className = m ? 'dot' : ''; });
  },
  onChatEvent(id){ if (location.hash.startsWith('#/chat/'+id) && this.chatDraw) this.chatDraw(); this.refreshBadges(); },
};

/* global interactions */
document.addEventListener('click', e => {
  const fav = e.target.closest('[data-fav]');
  if (fav){ e.preventDefault(); e.stopPropagation();
    if (!API.meId()) return needLogin(location.hash);
    if (API.auth.isOwner()) return toast('Owner accounts cannot save vehicles','bad');
    const id = fav.dataset.fav; const on = API.favs.toggle(id);
    $$(`[data-fav="${id}"]`).forEach(b=>{ b.classList.toggle('on', on); b.classList.toggle('fav-on', on); b.setAttribute('aria-pressed', on); });
    toast(on ? 'Saved to your list' : 'Removed from saved'); return;
  }
  const back = e.target.closest('[data-back]');
  if (back){ e.preventDefault(); if (history.length > 1 && App._navCount > 1) history.back(); else go(back.dataset.back); return; }
  if (e.target.closest('[data-drawer]')){
    const me = API.auth.me(); const ov = document.createElement('div'); ov.className='overlay'; ov.style.alignItems='stretch';
    ov.innerHTML = `<div class="drawer"><div style="display:flex;align-items:center;gap:12px;padding:6px 8px 18px;border-bottom:1px solid var(--line);margin-bottom:10px">${avatar(me)}<div>${me?`<b>${esc(me.name)}</b><div class="muted" style="font-size:13px">${esc(me.email)}</div>`:`<b>Welcome to Spidy</b><div><a href="#/login" class="link">Log in or sign up</a></div>`}</div></div>
      ${(me && me.role==='owner' ? [['home','#/','Home'],['cart','#/buy','Browse vehicles'],['search','#/search','Search'],['gauge','#/owner','Owner dashboard']] : [['home','#/','Home'],['cart','#/buy','Buy a vehicle'],['tag','#/sell','Sell your vehicle'],['search','#/search','Search'],['heart','#/favorites','Saved vehicles'],['msg','#/messages','Messages'],['bell','#/notifications','Notifications'],['bank','#/profile/finance','Finance requests'],['user','#/profile','Profile']]).map(([i,h,n])=>`<a href="${h}">${I(i)} ${n}</a>`).join('')}
      <div style="border-top:1px solid var(--line);margin-top:10px;padding-top:10px">${CATS.map(c=>`<a href="#/c/${c.id}" style="font-weight:500;color:var(--ink-2)">${I(c.icon,'sm')} ${esc(c.name)}</a>`).join('')}</div></div>`;
    ov.onclick = ev => { if (ev.target===ov || ev.target.closest('a')) ov.remove(); };
    $('#layer').appendChild(ov);
  }
});
App._navCount = 0;
window.addEventListener('hashchange', () => { App._navCount++; App.render(); });

/* extra layout rules that depend on the shell */
document.head.insertAdjacentHTML('beforeend', `<style>
.gbar{display:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:31;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
@media (min-width:960px){ .gbar{display:block} .topbar{position:static;background:transparent;border:0;backdrop-filter:none} .home-top .home-icons,.home-top [data-drawer]{display:none} .chat-page{height:calc(100vh - 64px - 64px)} }
.lcard{padding:0;display:block}
.lc-in{display:flex;gap:16px;padding:10px;min-width:0;align-items:flex-start}
.mini>a{display:block}
.hide-sm{display:inline}
@media (max-width:560px){ .hide-sm{display:none} }
.is-chat{padding-bottom:0!important}
.is-chat .chat-page{padding-bottom:calc(var(--nav-h) + 4px)}
@media (min-width:960px){ .is-chat .chat-page{padding-bottom:12px} }

@media (max-width:959px){ .is-chat .chat-page{height:calc(100dvh - 64px)} }
a.stat{display:block}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.role-switch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0 18px}.role-switch+.tabs{margin-top:-4px}
.role-switch a{display:flex;align-items:center;justify-content:center;gap:6px;height:44px;border:1px solid var(--line);border-radius:12px;font-weight:700;color:var(--ink-2)}
.role-switch a.on{border-color:var(--primary);background:var(--primary-50);color:var(--primary)}
.ogrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.ostat{padding:16px;display:flex;flex-direction:column;gap:2px}.ostat small{color:var(--ink-2);font-weight:600}.ostat b{font-size:26px;letter-spacing:-.02em}.ostat span{font-size:12.5px;color:var(--ink-3)}
.ocols{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media (max-width:760px){.ocols{grid-template-columns:1fr}}
.orow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.orow:first-of-type{border-top:0}.orow small{display:block;color:var(--ink-2);font-size:12.5px}.orow .grow{flex:1;min-width:0}
.otools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.otools .input{flex:1;min-width:200px}
.status.removed{background:var(--primary-50);color:var(--primary)}.status.closed{background:var(--line-2);color:var(--ink-2)}
</style>`);

/* boot */
(async function boot(){
  try { const t = localStorage.getItem('spidy_theme'); if (t) document.documentElement.dataset.theme = t; } catch(e){}
  try { await Sync.pull(); }
  catch(e){
    $('#app').innerHTML = `<div class="wrap page">${emptyState('info','Cannot reach the server', e.message, `<button class="btn btn-primary" onclick="location.reload()">Try again</button>`)}</div>`;
    return;
  }
  if (!location.hash) location.replace('#/');
  App.started = true; App.render();
  setInterval(() => { if (!document.hidden) Sync.pull().catch(()=>{}); }, 6000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) Sync.pull().catch(()=>{}); });
})();
</script>
